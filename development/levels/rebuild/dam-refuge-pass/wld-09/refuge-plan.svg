<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 732" role="img" aria-labelledby="title desc">
<title id="title">Blackwater Dam walk-in refuges</title>
<desc id="desc">The three fitted cupboards in the actual records office, workshop and switchgear room. An inset shows the whole protected interior and open threshold.</desc>
<style>text{font:15px sans-serif;fill:#294039}.title{font-size:29px;font-weight:700}.sub{font-size:17px;font-weight:700}.note{font-size:13px;fill:#49645a}</style>
