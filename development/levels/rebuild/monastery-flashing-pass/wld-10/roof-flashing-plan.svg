<text x="671" y="526" class="head">Cloister gable shoulders</text>
<text x="671" y="554" class="body">A wall upstand follows the higher gable face.</text>
<text x="671" y="578" class="body">At the shoulders it laps onto the adjacent slate.</text>
<text x="671" y="622" class="small">The archive–vestry seam and exposed eaves remain open.</text>
