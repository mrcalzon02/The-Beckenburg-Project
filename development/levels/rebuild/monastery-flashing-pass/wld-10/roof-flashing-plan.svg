.step{stroke:#a65224;stroke-width:4;stroke-linecap:round;fill:none}
.gable{stroke:#674f75;stroke-width:4;stroke-linecap:round;fill:none}
.valley{stroke:#34786f;stroke-width:2.5;stroke-linecap:round;fill:none}
