<text x="47" y="483" class="body">The riser feeds the bell switch along the east wall.</text>
<text x="47" y="511" class="body">Its sealed deck sleeve sits outside the stair well.</text>
<text x="473" y="483" class="body">The feeder descends through the solid vault cover between the wells.</text>
<text x="473" y="511" class="body">The memorial circuit branches before the passage switch.</text>
