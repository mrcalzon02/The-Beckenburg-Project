<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" role="img" aria-labelledby="title desc">
<title id="title">Monastery stair handrail plan and sections</title>
<desc id="desc">Four stair sections with fitted iron grips and a plan of the 180 degree bell tower landing.</desc>
