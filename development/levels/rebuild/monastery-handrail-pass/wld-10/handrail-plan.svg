.rail{stroke:#235842;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.floor{stroke:#746c59;fill:none;stroke-width:1.4}.panel{fill:#faf6ea;stroke:#cec1aa}
</style>
