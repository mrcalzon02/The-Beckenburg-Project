<text class="small" x="859" y="376" text-anchor="middle">Lead laps follow both original slate pitches.</text>
<text class="head" x="688" y="428">Longitudinal falls</text>
<text class="body" x="688" y="457">Gatehouse, dormitory and north range</text>
<text class="small" x="688" y="480">A shallow central crown drains both ends.</text>
<text class="body" x="688" y="515">Refectory</text>
<text class="small" x="688" y="538">The single fall moves away from the tower.</text>
<text class="body" x="688" y="601">Grade along each arm is 0.46%.</text>
<text class="small" x="688" y="632">The seven outfalls sit beyond the door approaches.</text>
<text class="small" x="688" y="655">Other roof junctions remain open for review.</text>
