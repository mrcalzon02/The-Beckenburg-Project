<svg xmlns="http://www.w3.org/2000/svg" width="825" height="544" viewBox="0 0 825 544" role="img" aria-labelledby="title desc">
  <title id="title">Beckenburg Penitentiary plant layout and circuits</title>
  <desc id="desc">The main breaker is founded on the north wall of the lower plant. A supported plant stair and doorway deliver the operator to the working aisle. The utility bank feeds twelve individually switched circuits and twenty-six mounted lights.</desc>
