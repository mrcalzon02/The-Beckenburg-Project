   <text x="28" y="106" font-size="17">Plant floor datum −3.00 m</text>
   <path d="M 75 122 H 396 V 384 H 75 V 338 M 75 299 V 122" fill="#203142" stroke="#74869a" stroke-width="3"/>
   <path d="M 75 299 H 37 V 338 H 75" fill="none" stroke="#74869a" stroke-width="3"/>
