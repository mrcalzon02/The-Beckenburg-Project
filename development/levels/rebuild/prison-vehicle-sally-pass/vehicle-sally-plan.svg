<svg xmlns="http://www.w3.org/2000/svg" width="800" height="670" viewBox="0 0 800 670" role="img" aria-labelledby="title desc">
 <title id="title">Prison vehicle sally facade and gate</title>
 <desc id="desc">Measured south opening with a full-width lintel and supported eave. The gate opens east into the sally and clears the three-metre by 3.04-metre vehicle profile. The north yard gate is independent. The forecourt and sally floor share a zero datum.</desc>
