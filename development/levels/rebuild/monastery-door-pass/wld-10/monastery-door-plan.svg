<title id="name">Monastery operating thresholds and open cloister</title>
<desc id="desc">The gold lines show fitted door leaves across the actual wall reveals. Green lines show the four open arcade connections. Blue dashed routes follow measured floors. An inset shows the lower memorial entrance.</desc>
