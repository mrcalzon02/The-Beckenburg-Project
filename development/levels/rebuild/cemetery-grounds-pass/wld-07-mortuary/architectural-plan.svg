<text x="775" y="272" class="sub" >The two guides share the original cemetery.</text>
<text x="775" y="299" class="sub" >Public court → hall → reception → viewing</text>
<text x="775" y="326" class="sub" >South yard → receiving → transfer → cold store</text>
<text x="775" y="353" class="sub" >Solid walls separate viewing from preparation</text>
<text x="775" y="380" class="sub" >and reception from receiving.</text>
<text x="775" y="622" class="sub" >Dashed guides are diagram annotations.</text>
<text x="775" y="645" class="sub" >Exported grounds and structures are the physical source.</text>
