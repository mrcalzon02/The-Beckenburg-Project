<svg xmlns="http://www.w3.org/2000/svg" width="830" height="450" viewBox="0 0 830 450" role="img" aria-labelledby="title desc">
  <title id="title">Prison hiding cupboard layout</title>
  <desc id="desc">North-up measured room plans show the physical cupboard footprints in records, chapel and the lower plant. Dotted arrows show the tested entry direction. They create no flooring or passage.</desc>
  <rect width="830" height="450" fill="#15202b"/>
  <g fill="#e6edf3" font-family="sans-serif" font-size="14">
  <text x="30" y="44" font-size="26">Beckenburg Penitentiary · physical cover</text>
  <text x="30" y="74" fill="#a7bad0">Room plans · north at top · each footprint drawn to its room scale</text>
  <text x="35" y="111" fill="#d8e7f7">Records · +0.00 m</text>
  <rect x="63.1667" y="126" width="146.667" height="220" fill="#263647" stroke="#71889d"/>
  <rect x="134.667" y="138.467" width="62.3334" height="47.7399" fill="#af7549" stroke="#f1c87b"/>
  <path d="M 165.833 208.8 V 186.207 l -4 5 m 4 -5 l 4 5" fill="none" stroke="#95d9ca" stroke-dasharray="3 2"/>
  <text x="306" y="111" fill="#d8e7f7">Chapel · +0.00 m</text>
  <rect x="334.167" y="126" width="146.667" height="220" fill="#263647" stroke="#71889d"/>
  <rect x="422.778" y="130.156" width="20.7777" height="15.9133" fill="#af7549" stroke="#f1c87b"/>
  <path d="M 433.167 158.933 V 146.069 l -4 5 m 4 -5 l 4 5" fill="none" stroke="#95d9ca" stroke-dasharray="3 2"/>
  <text x="577" y="111" fill="#d8e7f7">Plant · -3.00 m</text>
  <rect x="576" y="126" width="205" height="175.714" fill="#263647" stroke="#71889d"/>
  <rect x="734.875" y="128.343" width="24.8928" height="19.065" fill="#af7549" stroke="#f1c87b"/>
  <path d="M 747.321 161.236 V 147.408 l -4 5 m 4 -5 l 4 5" fill="none" stroke="#95d9ca" stroke-dasharray="3 2"/>
  <rect x="32" y="389" width="24" height="15" fill="#af7549" stroke="#f1c87b"/>
  <text x="65" y="402">Fixed cupboard footprint</text>
  <path d="M 280 397 H 311" stroke="#95d9ca" stroke-dasharray="4 3"/>
  <text x="320" y="402">Verified entry direction</text>
  <text x="32" y="427" fill="#a7bad0">Three physical pockets share the normal difficulty budget.</text>
  </g>
</svg>
