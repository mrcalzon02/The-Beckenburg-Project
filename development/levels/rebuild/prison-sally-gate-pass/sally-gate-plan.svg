  <title id="title">Penitentiary sally gate and manual releases</title>
  <desc id="desc">Plan and sally face elevation of the measured 2.40 metre exercise yard opening. A single leaf slides 2.53 metres east along the mounted overhead rail. Manual release handles are fixed to both faces of the west pier. The dashed path is a movement guide.</desc>
