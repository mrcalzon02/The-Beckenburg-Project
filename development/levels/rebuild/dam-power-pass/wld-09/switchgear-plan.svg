    text{font-family:Arial,sans-serif;fill:#e7efe9} .head{font-size:26px;font-weight:bold}
    .room{font-size:19px;font-weight:bold} .label{font-size:14px} .muted{fill:#a7bbc0}
    .shell{stroke:#aab7b4;stroke-width:7;fill:none;stroke-linecap:square}
    .feed{stroke:#f0b878;stroke-width:2;fill:none} .walk{stroke:#89bedc;stroke-width:2.5;stroke-dasharray:7 6;fill:none}
    .device{fill:#edb77b;stroke:#472e23;stroke-width:1}
  </style>
