<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 675" role="img" aria-labelledby="title desc">
  <title id="title">Blackwater Dam auxiliary power plan</title>
  <desc id="desc">Measured switchgear and turbine room plan at elevation minus six metres. The walk-in refuge and utility mounting aisle are inside switchgear, behind fitted door 880. Circuit lines run on the ceiling and wall, with a sealed electrical sleeve in their shared partition.</desc>
