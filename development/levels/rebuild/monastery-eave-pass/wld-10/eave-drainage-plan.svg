<path class="gutter fall" d="M672 158h30"/><text x="718" y="163" class="body">Graded eave gutter</text>
<circle class="bed" cx="687" cy="187" r="5"/><text x="718" y="192" class="body">Pipe and gravel outfall</text>
<path class="lap" d="M672 216h30"/><text x="718" y="221" class="body">Archive–vestry roof lap</text>
<text x="669" y="285" class="head">Five gutter runs</text>
<text x="669" y="314" class="body">The public gate and all four court eaves are fitted.</text>
<text x="669" y="340" class="body">A central crown falls 0.45% toward each outlet.</text>
<text x="669" y="366" class="body">Short end sections drain back to the nearest outlet.</text>
<text x="669" y="439" class="head">Ten outlets</text>
<text x="669" y="468" class="body">Water leaves each trough through a side notch.</text>
<text x="669" y="494" class="body">A hollow pipe empties beside the masonry pier,</text>
<text x="669" y="518" class="body">clear of the existing door approach.</text>
<text x="669" y="614" class="small">Outlying and tower eaves are outside this checkpoint.</text>
