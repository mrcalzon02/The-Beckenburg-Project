name: Beckenburg Development Seven-Client Match

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/main/java/org/beckenburg/DevAdminSnapshot.java'
      - 'src/main/java/org/beckenburg/DevMatchSession.java'
      - 'src/main/java/org/beckenburg/DevMatchClientAi.java'
      - 'src/main/java/org/beckenburg/DevMatchOutcomeReport.java'
      - 'src/main/java/org/beckenburg/DevAdminPanel.java'
      - 'src/main/java/org/beckenburg/LanHost.java'
      - '.github/workflows/beckenburg-dev-ai-match.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: beckenburg-dev-ai-match-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seven-real-client-phase-zero:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout actual game and authored runtime resources
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and run existing real-multiplayer acceptance
        shell: cmd
        run: build.cmd e2e

      - name: Run developer-only seven-client host and off-seat inspector
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & java '-Djava.awt.headless=true' '-Dbeckenburg.ai.profile=true' -ea -cp 'build\beckenburg-game.jar;build\test' org.beckenburg.DevMatchSession --dev-ai-match --seconds=6
          if ($LASTEXITCODE -ne 0) { throw "Development match smoke failed with exit code $LASTEXITCODE" }

      - name: Verify authored house entrance and six physical van exit targets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & java '-Djava.awt.headless=true' -ea -cp 'build\beckenburg-game.jar;build\test' org.beckenburg.DevMatchNavigationTest
          if ($LASTEXITCODE -ne 0) { throw "Dev AI navigation acceptance failed: exit $LASTEXITCODE" }

      - name: Exercise seven ongoing independent AI clients (headless)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & java '-Djava.awt.headless=true' -ea -cp 'build\beckenburg-game.jar;build\test' org.beckenburg.DevMatchSession --dev-ai-match --bots --seconds=8
          if ($LASTEXITCODE -ne 0) { throw "Seven-client AI activity acceptance failed: exit $LASTEXITCODE" }

      - name: Run three real AI-vs-AI scenarios (runtime failures block; outcomes advisory)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = @()
          foreach ($species in @('DEMON', 'WRAITH', 'SPIRIT')) {
            Write-Host "===== AUTHORITATIVE SEVEN-CLIENT MATCH: $species ====="
            & java '-Djava.awt.headless=true' -ea -cp 'build\beckenburg-game.jar;build\test' org.beckenburg.DevMatchSession --dev-ai-match --bots "--ghost=$species" --seconds=120
            $exitCode = $LASTEXITCODE
            $caseFolder = Join-Path 'build\dev-match-scenarios' $species
            New-Item -ItemType Directory -Force $caseFolder | Out-Null
            if (Test-Path 'build\dev-match') {
              Copy-Item 'build\dev-match\*' $caseFolder -Recurse -Force
            }
            if (Test-Path (Join-Path $caseFolder 'objective-results.txt')) {
              Get-Content (Join-Path $caseFolder 'objective-results.txt')
            } else {
              Write-Warning "$species produced no objective-results.txt"
            }
            if ($exitCode -ne 0) {
              $failures += "$species exit $exitCode"
              Write-Warning "$species match failed to run; captured its available trace"
            }
          }
          if ($failures.Count -gt 0) {
            throw "AI match runtime failures (crashes/network inactivity, not win-loss outcomes): $($failures -join '; ')"
          }

      - name: Capture diagnostics even after failure
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'build\dev-match' | Out-Null
          "source=${{ github.sha }}" | Set-Content -Path 'build\dev-match\revision.txt'
          if (-not (Test-Path 'build\dev-match\result.txt')) {
            'STARTUP OR BUILD FAILURE: no developer session completed; inspect workflow logs' |
              Set-Content -Path 'build\dev-match\result.txt'
          }

      - name: Publish authoritative AI results to issue 55 (nonblocking reporting)
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_STEPS_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference = 'Continue'
          $marker = '<!-- beckenburg-dev-ai-results -->'
          $runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $parts = @(
            $marker,
            '## Latest authoritative AI-vs-AI run',
            "- Run: $runUrl",
            "- Commit: $env:GITHUB_SHA",
            "- Test execution status before report step: $env:PRIOR_STEPS_STATUS",
            '- Seven genuine TCP players; off-seat admin; source: host-authoritative state',
            ''
          )
          foreach ($species in @('DEMON', 'WRAITH', 'SPIRIT')) {
            $parts += "### $species"
            $report = Join-Path (Join-Path 'build\dev-match-scenarios' $species) 'objective-results.txt'
            if (Test-Path $report) {
              $parts += '```text'
              $parts += @(Get-Content $report | Select-Object -First 16)
              $parts += '```'
            } else {
              $parts += 'No completed scenario report. Check job logs/artifacts for the actual failure.'
            }
            $parts += ''
          }
          $parts += 'Full logs/host combat CSVs: workflow run artifacts. Missing outcomes are not passes.'
          $body = $parts -join "`n"
          New-Item -ItemType Directory -Force 'build\dev-match' | Out-Null
          $payloadPath = 'build\dev-match\issue-report.json'
          @{ body = $body } | ConvertTo-Json -Depth 4 | Set-Content -Path $payloadPath -Encoding utf8
          $commentsRaw = & gh api -X GET "repos/$env:GITHUB_REPOSITORY/issues/55/comments?per_page=100" 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Warning 'AI results issue lookup failed (advisory only)'; exit 0 }
          $comments = @($commentsRaw | ConvertFrom-Json)
          $existing = $comments | Where-Object { $_.body -like "$marker*" } | Select-Object -First 1
          if ($existing) {
            & gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/issues/comments/$($existing.id)" --input $payloadPath | Out-Null
          } else {
            & gh api -X POST "repos/$env:GITHUB_REPOSITORY/issues/55/comments" --input $payloadPath | Out-Null
          }
          if ($LASTEXITCODE -ne 0) { Write-Warning 'AI results issue update failed (advisory only)' }
      - name: Upload real LAN and admin trace artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beckenburg-dev-match-combat-evidence-${{ github.run_number }}
          path: |
            build/dev-match/
            build/dev-match-scenarios/
            build/e2e/lan-full-round.txt
          if-no-files-found: warn
          retention-days: 14
