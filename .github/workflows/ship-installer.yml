name: Ship Beckenburg Windows Installer
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beckenburg-installer
  cancel-in-progress: false

jobs:
  package-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Select next installer version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = gh release list --limit 1000 --json tagName | ConvertFrom-Json
          $current = [version]'0.1.14'
          foreach ($release in $releases) {
            if ($release.tagName -match '^beckenburg-v(\d+\.\d+\.\d+)$') {
              $candidate = [version]$Matches[1]
              if ($candidate -gt $current) { $current = $candidate }
            }
          }
          $next = "$($current.Major).$($current.Minor).$($current.Build + 1)"
          "BECKENBURG_RELEASE_VERSION=$next" >> $env:GITHUB_ENV
          "BECKENBURG_SOURCE_SHA=$env:GITHUB_SHA" >> $env:GITHUB_ENV
          "BECKENBURG_TAG=beckenburg-v$next" >> $env:GITHUB_ENV

      - name: Package game without running any tests
        shell: cmd
        run: call build.cmd package

      - name: Bundle Java runtime with Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          jpackage --type app-image --name Beckenburg --input build --main-jar beckenburg-game.jar --dest dist --java-options "-Dfile.encoding=UTF-8"
          if ($LASTEXITCODE -ne 0) { throw 'jpackage failed' }

      - name: Package Windows installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC not found: $iscc" }
          New-Item -ItemType Directory -Force dist\installer | Out-Null
          & $iscc installer\beckenburg.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup packaging failed' }
          $exe = "dist\installer\Beckenburg-$env:BECKENBURG_RELEASE_VERSION-Windows-x64.exe"
          if (!(Test-Path $exe)) { throw "Installer missing: $exe" }

      - name: Generate download checksum
        shell: pwsh
        run: |
          $exe = "dist/installer/Beckenburg-$env:BECKENBURG_RELEASE_VERSION-Windows-x64.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $exe -Leaf)" | Set-Content -Encoding ascii dist/installer/SHA256SUMS.txt

      - name: Publish packaged installer on GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = "dist/installer/Beckenburg-$env:BECKENBURG_RELEASE_VERSION-Windows-x64.exe"
          gh release create $env:BECKENBURG_TAG $exe dist/installer/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Beckenburg $env:BECKENBURG_RELEASE_VERSION" --notes "Development build from $env:GITHUB_SHA. Developer diagnostics enabled by default. Packaging only; tests intentionally not run. Published without the GitHub prerelease flag for compatibility with older installed updaters."
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
