name: Ship Beckenburg Windows Installer
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beckenburg-installer
  # A superseded main commit must never publish an out-of-date installer.
  cancel-in-progress: true

jobs:
  package-and-release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Blender for original GGBot UV and material export
        shell: pwsh
        run: |
          $exe = Get-Command blender -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1
          if (-not $exe) {
            $exe = Get-ChildItem (Join-Path $env:ProgramFiles 'Blender Foundation') -Filter blender.exe -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe) {
            choco install blender -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Blender installation failed' }
            $exe = Get-ChildItem (Join-Path $env:ProgramFiles 'Blender Foundation') -Filter blender.exe -Recurse -File | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe -or -not (Test-Path $exe)) { throw 'Cannot locate installed Blender executable' }
          Split-Path $exe -Parent | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Blender is unavailable' }

      - name: Select next installer version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = gh release list --limit 1000 --json tagName | ConvertFrom-Json
          $current = [version]'0.1.14'
          foreach ($release in $releases) {
            if ($release.tagName -match '^beckenburg-v(\d+\.\d+\.\d+)$') {
              $candidate = [version]$Matches[1]
              if ($candidate -gt $current) { $current = $candidate }
            }
          }
          $next = "$($current.Major).$($current.Minor).$($current.Build + 1)"
          "BECKENBURG_RELEASE_VERSION=$next" >> $env:GITHUB_ENV
          "BECKENBURG_SOURCE_SHA=$env:GITHUB_SHA" >> $env:GITHUB_ENV
          "BECKENBURG_TAG=beckenburg-v$next" >> $env:GITHUB_ENV

      # A successful standalone installer is NOT an acceptance test.
      # Rebuild and exercise the packaged multiplayer game at this exact SHA
      # before allowing the shipping steps (and the release tag) to execute.
      - name: Verify authored levels and packaged TCP multiplayer round
        shell: cmd
        run: call build.cmd e2e

      - name: Run complete Java regression manifest
        shell: cmd
        run: java -Djava.awt.headless=true -ea -cp build\classes org.beckenburg.BeckenburgRegressionSuite

      - name: Verify packaged desktop game and multiplayer UI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & java '-Djava.awt.headless=false' -ea -cp 'build\beckenburg-game.jar;build\test' org.beckenburg.BeckenburgDesktopE2ETest
          if ($LASTEXITCODE -ne 0) { throw "Packaged desktop acceptance failed: $LASTEXITCODE" }


      - name: Bundle actual Java 17 OpenGL 3.3 backend and game assets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          mvn -B -ntp -f gpu-client/pom.xml -DskipTests package
          if ($LASTEXITCODE -ne 0) { throw 'GPU client dependency packaging failed' }
          $gpu='gpu-client/target/BeckenburgGPU.jar'
          if (!(Test-Path $gpu)) { throw 'OpenGL GPU application JAR missing' }
          $contents=& jar --list --file $gpu
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect GPU application' }
          foreach ($needed in @('org/beckenburg/gpu/GpuDesktop.class',
              'org/beckenburg/gpu/OpenGlWorldRenderer.class',
              'org/beckenburg/InvestigationGame.class')) {
            if ($contents -notcontains $needed) { throw "Packaged GPU app missing $needed" }
          }
          Copy-Item $gpu build/BeckenburgGPU.jar -Force
      - name: Bundle Java runtime with GPU-first Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          jpackage --type app-image --name Beckenburg --input build --main-jar BeckenburgGPU.jar --dest dist --java-options "-Dfile.encoding=UTF-8"
          if ($LASTEXITCODE -ne 0) { throw 'GPU-first jpackage failed' }

      - name: Include editor with installed project files
        shell: pwsh
        run: |
          & cmd /c tools\build-editor-kit.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Standalone editor compiler failed' }
          New-Item -ItemType Directory -Force dist\Beckenburg\tools | Out-Null
          New-Item -ItemType Directory -Force dist\installer | Out-Null
          Copy-Item build\editor-kit\LevelEditorKit-Java17.jar dist\Beckenburg\tools\LevelEditorKit-Java17.jar
          Copy-Item build\editor-kit\LevelEditorKit-Java17.jar dist\installer\LevelEditorKit-Java17.jar
          Copy-Item docs\development\MODULAR_LEVEL_EDITOR.md dist\Beckenburg\tools\MODULAR_LEVEL_EDITOR.md
          $required = @(
            'org/beckenburg/DeveloperLevelEditor.class',
            'org/beckenburg/editor/EditorProject.class'
          )
          $contents = & jar --list --file build\beckenburg-game.jar
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect game jar' }
          foreach ($class in $required) {
            if ($contents -notcontains $class) { throw "Installed game missing $class" }
          }

      - name: Package Windows installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC not found: $iscc" }
          New-Item -ItemType Directory -Force dist\installer | Out-Null
          & $iscc installer\beckenburg.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup packaging failed' }
          $exe = "dist\installer\Beckenburg-$env:BECKENBURG_RELEASE_VERSION-Windows-x64.exe"
          if (!(Test-Path $exe)) { throw "Installer missing: $exe" }

      - name: Generate download checksums
        shell: pwsh
        run: |
          $files = @(
            "dist/installer/Beckenburg-$env:BECKENBURG_RELEASE_VERSION-Windows-x64.exe",
            "dist/installer/LevelEditorKit-Java17.jar"
          )
          $lines = foreach ($file in $files) {
            if (!(Test-Path $file)) { throw "Missing release file: $file" }
            "$((Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant())  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content -Encoding ascii dist/installer/SHA256SUMS.txt

      - name: Publish packaged installer on GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = "dist/installer/Beckenburg-$env:BECKENBURG_RELEASE_VERSION-Windows-x64.exe"
          gh release create $env:BECKENBURG_TAG $exe dist/installer/LevelEditorKit-Java17.jar dist/installer/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Beckenburg $env:BECKENBURG_RELEASE_VERSION" --notes "Development build from $env:GITHUB_SHA. Packaged TCP multiplayer, full regression manifest and desktop UI smoke passed on this exact revision before publication; hardware GPU frame rate and physical user acceptance remain separate gates. Published as a development-channel-compatible release for existing installed updaters."
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
