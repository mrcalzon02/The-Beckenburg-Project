name: Ship Beckenburg Windows Installer
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: beckenburg-installer
  # Development often pushes faster than Windows packaging can finish.
  # Never cancel a working release indefinitely; serialize and publish its
  # verified source SHA, even if newer commits are queued for a later update.
  cancel-in-progress: false

jobs:
  package-and-release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Blender for approved canonical asset export
        shell: pwsh
        run: .\scripts\ci\ensure-blender.ps1
      - name: Select next installer version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = gh release list --limit 1000 --json tagName | ConvertFrom-Json
          $current = [version]'0.1.14'
          foreach ($release in $releases) {
            if ($release.tagName -match '^beckenburg-v(\d+\.\d+\.\d+)$') {
              $candidate = [version]$Matches[1]
              if ($candidate -gt $current) { $current = $candidate }
            }
          }
          $next = "$($current.Major).$($current.Minor).$($current.Build + 1)"
          "BECKENBURG_RELEASE_VERSION=$next" >> $env:GITHUB_ENV
          "BECKENBURG_SOURCE_SHA=$env:GITHUB_SHA" >> $env:GITHUB_ENV
          "BECKENBURG_TAG=beckenburg-v$next" >> $env:GITHUB_ENV

      # Release blockers are only proofs that the game actually works.
      # Full visual, audio, GPU benchmark and extended regression suites run
      # independently as development diagnostics; do not gate an updater release.
      - name: Build playable Java 17 game and its required runtime assets
        shell: cmd
        run: call build.cmd package

      - name: Compile only functional release-smoke harnesses
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\classes -sourcepath src\test\java -d build\test src\test\java\org\beckenburg\BeckenburgFullRoundE2ETest.java src\test\java\org\beckenburg\BeckenburgDesktopE2ETest.java src\test\java\org\beckenburg\CampaignEmbeddedDesktopTest.java src\test\java\org\beckenburg\BeckenburgInstallerHandoffTest.java
          if errorlevel 1 exit /b 1

      - name: Prove packaged multiplayer investigation actually completes
        shell: cmd
        run: |
          java -Djava.awt.headless=true -ea -cp build\beckenburg-game.jar;build\test org.beckenburg.BeckenburgFullRoundE2ETest
          if errorlevel 1 exit /b 1

      - name: Prove Castle startup, playable solo round and multiplayer interface
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & java '-Djava.awt.headless=false' -ea -cp 'build\beckenburg-game.jar;build\test' org.beckenburg.BeckenburgDesktopE2ETest
          if ($LASTEXITCODE -ne 0) { throw 'Packaged game failed the real Castle / solo / multiplayer launch smoke' }
          & java '-Djava.awt.headless=false' -ea -cp 'build\beckenburg-game.jar;build\test' org.beckenburg.CampaignEmbeddedDesktopTest
          if ($LASTEXITCODE -ne 0) { throw 'The campaign cannot open inside the working Castle UI' }

      - name: Bundle optional GPU-first runtime (software-only remains playable)
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          mvn -B -ntp -f gpu-client/pom.xml -DskipTests package
          if ($LASTEXITCODE -ne 0) { throw 'GPU client dependency packaging failed' }
          $gpu='gpu-client/target/BeckenburgGPU.jar'
          if (!(Test-Path $gpu)) { throw 'OpenGL GPU application JAR missing' }
          $contents=& jar --list --file $gpu
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect GPU application' }
          foreach ($needed in @('org/beckenburg/gpu/GpuDesktop.class',
              'org/beckenburg/gpu/OpenGlWorldRenderer.class',
              'org/beckenburg/InvestigationGame.class')) {
            if ($contents -notcontains $needed) { throw "Packaged GPU app missing $needed" }
          }
          Copy-Item $gpu build/BeckenburgGPU.jar -Force
      # Advanced GPU benchmark, artistic flyover and frame-parity acceptance
      # remain in gpu-renderer.yml. They are NOT release gates. The installed
      # game must instead prove it can reach the Castle, via GPU or software.

      - name: Bundle working Windows app with GPU-first and software fallback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $jar=if(Test-Path 'build/BeckenburgGPU.jar'){'BeckenburgGPU.jar'}else{'beckenburg-game.jar'}
          $renderer=if($jar -eq 'BeckenburgGPU.jar'){'GPU-first with automatic software recovery'}else{'software-only recovery'}
          & jpackage --type app-image --name Beckenburg --input build --main-jar $jar --dest dist --icon build/Beckenburg.ico --java-options '-Dfile.encoding=UTF-8'
          if ($LASTEXITCODE -ne 0) { throw 'Windows game executable packaging failed' }
          if(-not (Test-Path 'dist/Beckenburg/Beckenburg.exe')) { throw 'Packaged Windows game executable absent' }
          "BECKENBURG_RENDERER_MODE=$renderer" >> $env:GITHUB_ENV
          Write-Host "Packaged playable Windows app: $renderer"

      - name: Include standalone editor when available (never gate playable game)
        continue-on-error: true
        shell: pwsh
        run: |
          & cmd /c tools\build-editor-kit.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Standalone editor compiler failed' }
          New-Item -ItemType Directory -Force dist\Beckenburg\tools | Out-Null
          New-Item -ItemType Directory -Force dist\installer | Out-Null
          Copy-Item build\editor-kit\LevelEditorKit-Java17.jar dist\Beckenburg\tools\LevelEditorKit-Java17.jar
          Copy-Item build\editor-kit\LevelEditorKit-Java17.jar dist\installer\LevelEditorKit-Java17.jar
          Copy-Item docs\development\MODULAR_LEVEL_EDITOR.md dist\Beckenburg\tools\MODULAR_LEVEL_EDITOR.md
          $required = @(
            'org/beckenburg/DeveloperLevelEditor.class',
            'org/beckenburg/editor/EditorProject.class'
          )
          $contents = & jar --list --file build\beckenburg-game.jar
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect game jar' }
          foreach ($class in $required) {
            if ($contents -notcontains $class) { throw "Installed game missing $class" }
          }

      - name: Package Windows installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC not found: $iscc" }
          New-Item -ItemType Directory -Force dist\installer | Out-Null
          & $iscc installer\beckenburg.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup packaging failed' }
          $exe = "dist\installer\Beckenburg-$env:BECKENBURG_RELEASE_VERSION-Windows-x64.exe"
          if (!(Test-Path $exe)) { throw "Installer missing: $exe" }

      - name: Verify installed EXE starts the actual Castle and updater stays external
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $helper=Join-Path $env:RUNNER_TEMP 'beckenburg-install-after-exit.ps1'
          & java -ea -cp 'build\classes;build\test' org.beckenburg.BeckenburgInstallerHandoffTest --emit-script $helper
          if($LASTEXITCODE -ne 0) { throw 'Independent update helper is not functional' }
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($helper,[ref]$tokens,[ref]$errors)
          if(@($errors).Count -gt 0) { throw 'Update helper script cannot execute' }
          $exe=(Resolve-Path "dist\installer\Beckenburg-$env:BECKENBURG_RELEASE_VERSION-Windows-x64.exe").Path
          $target=Join-Path $env:RUNNER_TEMP 'Beckenburg-Installed-Smoke'
          $log=Join-Path $env:RUNNER_TEMP 'beckenburg-setup-smoke.log'
          $arguments=@('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $target + '"'),('/LOG="' + $log + '"'))
          $install=Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru
          if($install.ExitCode -ne 0) { throw "Standalone setup failed: exit=$($install.ExitCode), log=$log" }
          $installed=Join-Path $target 'Beckenburg.exe'
          $jar=Join-Path $target 'app'
          if(-not (Test-Path $installed -PathType Leaf)) { throw 'Windows setup did not install its game executable' }
          if(-not (Test-Path (Join-Path $jar 'beckenburg-game.jar') -PathType Leaf) -and
             -not (Test-Path (Join-Path $jar 'BeckenburgGPU.jar') -PathType Leaf)) {
            throw 'Windows setup did not install a playable game runtime'
          }
          # Installed executable MUST open the current Castle-first game,
          # not merely launch a splash or satisfy an obsolete menu string.
          $started=Get-Date
          $process=Start-Process -FilePath $installed -ArgumentList '--software' -PassThru
          $ready=$false
          try {
            $diagnostics=Join-Path $env:USERPROFILE '.beckenburg\diagnostics'
            $deadline=(Get-Date).AddSeconds(90)
            while((Get-Date) -lt $deadline) {
              if($process.HasExited) { throw "Installed game exited before Castle readiness: $($process.ExitCode)" }
              if(Test-Path $diagnostics) {
                foreach($file in @(Get-ChildItem $diagnostics -Filter 'session-*.log' -ErrorAction SilentlyContinue)) {
                  if($file.LastWriteTime -lt $started.AddSeconds(-2)) { continue }
                  $body=Get-Content $file.FullName -Raw -ErrorAction SilentlyContinue
                  if($body -and $body.Contains('PHASE ready') -and
                     $body.Contains('PHASE Castle home available')) { $ready=$true;break }
                }
              }
              if($ready) {break}
              Start-Sleep -Milliseconds 500
            }
            if(-not $ready) { throw 'Installed game never reached the playable Castle home' }
            Write-Host 'PASS: independent Windows installer, external updater and installed game reaches Castle home'
          } finally {
            if($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Generate download checksums
        shell: pwsh
        run: |
          $files = @("dist/installer/Beckenburg-$env:BECKENBURG_RELEASE_VERSION-Windows-x64.exe")
          if(Test-Path 'dist/installer/LevelEditorKit-Java17.jar') {
            $files += 'dist/installer/LevelEditorKit-Java17.jar'
          }
          $lines = foreach ($file in $files) {
            if (!(Test-Path $file)) { throw "Missing release file: $file" }
            "$((Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant())  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content -Encoding ascii dist/installer/SHA256SUMS.txt

      - name: Publish packaged installer on GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $checkedOut=(& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkedOut -ne $env:GITHUB_SHA) {
            throw 'Release checkout no longer matches the verified build source'
          }
          # New main commits do not invalidate a tested, runnable update.
          # The next serialized run will supersede it once it also passes.
          $exe="dist/installer/Beckenburg-$env:BECKENBURG_RELEASE_VERSION-Windows-x64.exe"
          $assets=@($exe,'dist/installer/SHA256SUMS.txt')
          if(Test-Path 'dist/installer/LevelEditorKit-Java17.jar') {
            $assets += 'dist/installer/LevelEditorKit-Java17.jar'
          }
          $notes="Playable development update from $env:GITHUB_SHA. Blockers: Java game builds, packaged TCP round finishes, real Castle and solo game launch, independent Windows setup, installed EXE reaches Castle home, and updater helper is valid. Extended regressions, art/audio audits and GPU performance benchmarks are advisory; renderer packaged: $env:BECKENBURG_RENDERER_MODE."
          & gh release create $env:BECKENBURG_TAG @assets --target $env:GITHUB_SHA --title "Beckenburg $env:BECKENBURG_RELEASE_VERSION" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
          $published=& gh release view $env:BECKENBURG_TAG --json tagName,isDraft,assets | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $published.isDraft -or $published.tagName -ne $env:BECKENBURG_TAG) {
            throw 'Published update could not be confirmed on GitHub'
          }
          foreach($asset in $assets) {
            $name=Split-Path $asset -Leaf
            if(-not @($published.assets | Where-Object { $_.name -eq $name -and $_.size -gt 0 }).Count) {
              throw "Published update missing asset $name"
            }
          }
          Write-Host "PUBLISHED and verified update $env:BECKENBURG_TAG / $env:GITHUB_SHA"
