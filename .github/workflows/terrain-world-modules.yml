name: Terrain and Loading Zone Module Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/org/beckenburg/editor/TerrainZoneDocument.java'
      - 'src/main/java/org/beckenburg/editor/TerrainZoneEditor.java'
      - 'src/main/java/org/beckenburg/editor/StitchedHeightmapWorld.java'
      - 'src/main/java/org/beckenburg/editor/AdaptiveTerrainTopology.java'
      - 'src/main/java/org/beckenburg/editor/LayeredTerrainQueries.java'
      - 'src/main/java/org/beckenburg/editor/AdaptiveNavigationRegions.java'
      - 'src/main/java/org/beckenburg/editor/AdaptiveNavMeshEdits.java'
      - 'src/main/java/org/beckenburg/editor/AdaptiveNavMeshEditor.java'
      - 'src/main/java/org/beckenburg/editor/LayeredTerrainDocument.java'
      - 'src/main/java/org/beckenburg/editor/RampEntranceDocument.java'
      - 'src/main/java/org/beckenburg/editor/RampEntranceEditor.java'
      - 'src/main/java/org/beckenburg/editor/EntranceSeamDocument.java'
      - 'src/main/java/org/beckenburg/editor/EntranceSeamTopology.java'
      - 'src/main/java/org/beckenburg/editor/EntranceSeamEditor.java'
      - 'src/main/java/org/beckenburg/editor/TerrainEntranceMesh.java'
      - 'src/main/java/org/beckenburg/editor/TerrainEntrancePreview.java'
      - 'src/main/java/org/beckenburg/editor/RuntimeSceneDocument.java'
      - 'src/main/java/org/beckenburg/editor/TerrainScenePackage.java'
      - 'src/main/java/org/beckenburg/editor/TerrainRailScenePackage.java'
      - 'src/main/java/org/beckenburg/editor/TerrainScenePackageEditor.java'
      - 'src/main/java/org/beckenburg/editor/LayeredGeometryEditor.java'
      - 'src/main/java/org/beckenburg/editor/AdaptiveTopologyEditor.java'
      - 'src/main/java/org/beckenburg/editor/StitchedWorldEditor.java'
      - 'src/test/java/org/beckenburg/editor/TerrainZoneDocumentTest.java'
      - 'src/test/java/org/beckenburg/editor/StitchedHeightmapWorldTest.java'
      - 'src/test/java/org/beckenburg/editor/AdaptiveTerrainTopologyTest.java'
      - 'src/test/java/org/beckenburg/editor/LayeredTerrainQueriesTest.java'
      - 'src/test/java/org/beckenburg/editor/AdaptiveNavigationRegionsTest.java'
      - 'src/test/java/org/beckenburg/editor/AdaptiveNavMeshEditsTest.java'
      - 'src/test/java/org/beckenburg/editor/LayeredTerrainDocumentTest.java'
      - 'src/test/java/org/beckenburg/editor/RampEntranceDocumentTest.java'
      - 'src/test/java/org/beckenburg/editor/EntranceSeamDocumentTest.java'
      - 'src/test/java/org/beckenburg/editor/TerrainEntranceMeshTest.java'
      - 'src/test/java/org/beckenburg/editor/RuntimeSceneDocumentTest.java'
      - 'src/test/java/org/beckenburg/editor/TerrainScenePackageTest.java'
      - 'src/test/java/org/beckenburg/editor/TerrainRailScenePackageTest.java'
      - 'tools/build-editor-kit.cmd'
      - '.github/workflows/terrain-world-modules.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-terrain-module-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile real portable editor module
        shell: cmd
        run: call tools\build-editor-kit.cmd
      - name: Terrain and loading-zone document acceptance
        shell: cmd
        run: |
          if not exist build\editor-kit\test mkdir build\editor-kit\test
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\TerrainZoneDocumentTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.TerrainZoneDocumentTest
          if errorlevel 1 exit /b 1
      - name: Stitched 16-bit open world heightmap and seam acceptance
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\StitchedHeightmapWorldTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.StitchedHeightmapWorldTest
          if errorlevel 1 exit /b 1
      - name: Sparse adaptive terrain topology and cross-tile edge breaks
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\AdaptiveTerrainTopologyTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.AdaptiveTerrainTopologyTest
          if errorlevel 1 exit /b 1
      - name: Layered terrain collision, cutout and vertical floor acceptance
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\LayeredTerrainQueriesTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.LayeredTerrainQueriesTest
          if errorlevel 1 exit /b 1
      - name: Adaptive region routing and independent layer link acceptance
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\AdaptiveNavigationRegionsTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.AdaptiveNavigationRegionsTest
          if errorlevel 1 exit /b 1

      - name: Authored nav flood-fill, manual masks and transition-gate acceptance
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\AdaptiveNavMeshEditsTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.AdaptiveNavMeshEditsTest
          if errorlevel 1 exit /b 1

      - name: Authored underground floor, solid collision and layer transition acceptance
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\LayeredTerrainDocumentTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.LayeredTerrainDocumentTest
          if errorlevel 1 exit /b 1

      - name: Smooth physically continuous cave/bunker ramp acceptance
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\RampEntranceDocumentTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.RampEntranceDocumentTest
          if errorlevel 1 exit /b 1

      - name: Three terrain entrance seam methods and detached nav tab acceptance
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\EntranceSeamDocumentTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.EntranceSeamDocumentTest
          if errorlevel 1 exit /b 1

      - name: Real 3D entrance mesh export, topology seams and OBJ readback acceptance
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\TerrainEntranceMeshTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.TerrainEntranceMeshTest
          if errorlevel 1 exit /b 1

      - name: Real terrain-to-runtime-scene package and asset integrity acceptance
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\RuntimeSceneDocumentTest.java src\test\java\org\beckenburg\editor\TerrainScenePackageTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.RuntimeSceneDocumentTest
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.TerrainScenePackageTest
          if errorlevel 1 exit /b 1
