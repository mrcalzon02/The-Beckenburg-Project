name: Possessive Ghost Atlas Source Inspection (advisory)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/possessive-atlas-source-review.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Never block builds/releases on visual judgement.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble original shipped ghost sprite archive
        run: |
          set -euo pipefail
          mkdir -p build/possessive-source
          cat assets/runtime/ghost-sprite-parts/ghost-sprite-expansion-v3.zip.part0[0-8] > build/possessive-source/runtime-v3.zip
          unzip -t build/possessive-source/runtime-v3.zip | tail -2
          sha256sum build/possessive-source/runtime-v3.zip > build/possessive-source/archive-hash.txt
      - name: Extract only exact Possessive images with directional identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io
          import json
          from pathlib import Path
          import zipfile
          root = Path("build/possessive-source")
          with zipfile.ZipFile(root/"runtime-v3.zip") as z:
              matches = [x for x in z.namelist() if x.startswith("frames/possessive/") and x.endswith(".png")]
              if len(matches) != 8:
                  raise ValueError(f"Expected 8 Possessive source atlas views; got {matches}")
              for path in matches:
                  data = z.read(path)
                  out = root / path
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(data)
              (root/"source-index.json").write_text(json.dumps({
                  "source_archive": "exact shipped ghost-sprite-expansion-v3.zip",
                  "entries": sorted(matches),
                  "note": "Unmodified source images, not approved visual fixes"
              }, indent=2)+"\n")
          PY
          cp assets/concept-art/v001/03-ghosts/possessive-ghost-profile.png build/possessive-source/approved-master.png
          rm build/possessive-source/runtime-v3.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: possessive-actual-shipped-ghost-atlas-and-original-master
          path: build/possessive-source/
          if-no-files-found: warn
          retention-days: 14
