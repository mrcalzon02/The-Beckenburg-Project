name: Inspect original Castle resident silhouettes (nonblocking)
on:
  push:
    branches: [main]
    paths:
      - 'tools/castle_alpha_diagnostics.py'
      - '.github/workflows/castle-alpha-inspection.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: castle-original-art-inspection
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - name: Create master-source and alpha matte visual references
        run: python tools/castle_alpha_diagnostics.py
      - name: Publish actual previews to project gallery
        run: |
          python tools/build_development_gallery.py
          python tools/build_development_gallery.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add development/quality/castle-resident-art/source-diagnostic/previews/ development/gallery/index.json beckenburg-development-gallery.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test(castle): preserve original silhouette diagnostic captures"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: castle-master-alpha-previews
          path: development/quality/castle-resident-art/source-diagnostic/previews/
          if-no-files-found: warn
