name: Diagnose Beckenburg import failures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-import.yml'

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  collect-failure-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Extract failed import run IDs, steps and job log errors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/report_import_failure.py
