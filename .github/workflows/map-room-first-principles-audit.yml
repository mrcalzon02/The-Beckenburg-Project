name: Map First-Principles Room Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/main/java/org/beckenburg/LevelPlans.java'
      - 'src/main/java/org/beckenburg/LevelDefinition.java'
      - 'src/main/java/org/beckenburg/HouseMap.java'
      - 'src/main/java/org/beckenburg/HollowCreekLevel.java'
      - 'src/main/java/org/beckenburg/CastleHubMap.java'
      - 'src/main/java/org/beckenburg/CastleRooms.java'
      - 'src/main/java/org/beckenburg/CastleLevelEdits.java'
      - 'src/main/java/org/beckenburg/LevelDressing.java'
      - 'src/main/java/org/beckenburg/SceneRenderer.java'
      - 'src/main/java/org/beckenburg/LevelEnclosure.java'
      - 'src/main/java/org/beckenburg/MissionSites.java'
      - 'src/test/java/org/beckenburg/SiteRoomCompassAudit.java'
      - 'assets/runtime/models/level_*.glb'
      - 'assets/runtime/sites/**'
      - '.github/workflows/map-room-first-principles-audit.yml'

permissions:
  contents: read

concurrency:
  group: map-first-principles-audit
  cancel-in-progress: false

jobs:
  inspect-every-room:
    name: Four directions from all site room centers (diagnostic)
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile actual Java 17 game and runtime assets
        shell: cmd
        run: call build.cmd package
      - name: Compile four-direction camera inspector (advisory)
        continue-on-error: true
        shell: cmd
        run: |
          if not exist build\test mkdir build\test
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\SiteRoomCompassAudit.java
          if errorlevel 1 exit /b 1
      - name: Capture nine playable sites, native prototype and Castle hub
        continue-on-error: true
        shell: cmd
        run: |
          if not exist build\map-first-principles-audit mkdir build\map-first-principles-audit
          java -Djava.awt.headless=true -cp build\classes;build\test org.beckenburg.SiteRoomCompassAudit --include-prototypes --output=build/map-first-principles-audit
      - name: Physically traverse every currently playable site from the van (advisory)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'build/map-first-principles-audit' | Out-Null
          & javac --release 17 -encoding UTF-8 -cp 'build\classes' -d 'build\test' 'src\test\java\org\beckenburg\AuthoredLevelReachabilityTest.java'
          if ($LASTEXITCODE -ne 0) { Write-Warning 'Navigation auditor compilation failed'; exit 1 }
          $sites = 'HOUSE','FARMHOUSE','SCHOOL','MANSION','PRISON','ASYLUM','ACADEMY','COLLEGE','CHURCH'
          $summary = New-Object System.Collections.Generic.List[string]
          foreach ($site in $sites) {
            $path = "build/map-first-principles-audit/$($site.ToLower())/swept-physics-from-van.txt"
            New-Item -ItemType Directory -Force (Split-Path $path) | Out-Null
            & java '-Djava.awt.headless=true' '-ea' -cp 'build\classes;build\test' org.beckenburg.AuthoredLevelReachabilityTest $site 2>&1 | Out-File -FilePath $path -Encoding utf8
            if ($LASTEXITCODE -eq 0) { $summary.Add("$site,PASS") }
            else { $summary.Add("$site,REVIEW_ROUTE_FAILURE"); Write-Warning "$site traversal requires repair: inspect $path" }
          }
          @('site,route_status') + $summary | Set-Content -Path 'build/map-first-principles-audit/navigation-summary.csv'
      - name: Capture an authoritative audit manifest even after a failed camera
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'build/map-first-principles-audit' | Out-Null
          "source=$env:GITHUB_SHA" | Set-Content 'build/map-first-principles-audit/revision.txt'
          "Run: $env:GITHUB_RUN_ID" | Add-Content 'build/map-first-principles-audit/revision.txt'
      - name: Archive every room image, directional matrix, doors and findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beckenburg-all-room-four-direction-audit
          path: build/map-first-principles-audit/
          if-no-files-found: warn
          retention-days: 21
