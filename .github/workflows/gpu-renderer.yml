name: Beckenburg GPU Renderer Acceptance
on:
  push:
    branches: [main, 'performance/**']
    paths:
      - 'gpu-client/**'
      - 'src/main/java/org/beckenburg/GpuWorldRenderer.java'
      - 'src/main/java/org/beckenburg/SceneRenderer.java'
      - 'src/main/java/org/beckenburg/LevelOpeningCinematic.java'
      - 'src/main/java/org/beckenburg/OpeningPlaybackClock.java'
      - 'src/test/java/org/beckenburg/OpeningPlaybackClockTest.java'
      - 'src/main/java/org/beckenburg/LevelOpeningFlyover.java'
      - 'src/test/java/org/beckenburg/LevelOpeningFlyoverTest.java'
      - 'src/main/java/org/beckenburg/DebugPerformanceHud.java'
      - 'src/main/java/org/beckenburg/FixtureLighting.java'
      - 'src/main/java/org/beckenburg/PreparedFixtureProbeCache.java'
      - 'src/test/java/org/beckenburg/FixtureLightingRevisionTest.java'
      - 'src/test/java/org/beckenburg/PreparedFixtureProbeCacheTest.java'
      - 'src/test/java/org/beckenburg/VanHouseViewportProfileTest.java'
      - '.github/workflows/gpu-renderer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-gpu-java17:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile GPU and complete authoritative game sources
        run: |
          mkdir -p build/classes/org/beckenburg
          printf 'stale compiled resource' > build/classes/org/beckenburg/ObsoleteResourceProbe.class
          mvn -B -ntp -f gpu-client/pom.xml -DskipTests compile
          test ! -e gpu-client/target/classes/org/beckenburg/ObsoleteResourceProbe.class
          rm build/classes/org/beckenburg/ObsoleteResourceProbe.class
          mkdir -p build/contract-test
          javac --release 17 -cp gpu-client/target/classes -d build/contract-test src/test/java/org/beckenburg/GpuWorldRendererContractTest.java src/test/java/org/beckenburg/RendererVisibilityTest.java
          java -Djava.awt.headless=true -ea -cp gpu-client/target/classes:build/contract-test org.beckenburg.GpuWorldRendererContractTest
          java -Djava.awt.headless=true -ea -cp gpu-client/target/classes:build/contract-test org.beckenburg.RendererVisibilityTest
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Blender for approved canonical asset export
        shell: pwsh
        run: .\scripts\ci\ensure-blender.ps1
      - name: Package canonical assets with Java 17
        shell: cmd
        run: call build.cmd package
      - name: Measure actual House viewports from van to interior (CPU baseline + screenshot HUD)
        shell: cmd
        run: |
          if not exist build\\test mkdir build\\test
          javac --release 17 -encoding UTF-8 -cp build\\classes -d build\\test src\\test\\java\\org\\beckenburg\\VanHouseViewportProfileTest.java || exit /b 1
          java -Djava.awt.headless=true -Dbeckenburg.debug.overlay=true -ea -cp build\\classes;build\\test org.beckenburg.VanHouseViewportProfileTest || exit /b 1
      - name: Verify prepared scenery reuse, image parity and scene invalidation
        shell: cmd
        run: |
          if not exist build\\test mkdir build\\test
          javac --release 17 -encoding UTF-8 -cp build\\classes -d build\\test src\\test\\java\\org\\beckenburg\\PreparedSceneryRetentionTest.java || exit /b 1
          java -Djava.awt.headless=true -ea -cp build\\classes;build\\test org.beckenburg.PreparedSceneryRetentionTest || exit /b 1
      - name: Verify conservative static shell chunks preserve functional world geometry
        shell: cmd
        run: |
          if not exist build\\test mkdir build\\test
          javac --release 17 -encoding UTF-8 -cp build\\classes -d build\\test src\\test\\java\\org\\beckenburg\\PreparedShellChunkTest.java || exit /b 1
          java -Djava.awt.headless=true -ea -cp build\\classes;build\\test org.beckenburg.PreparedShellChunkTest || exit /b 1
      - name: Verify flyover preview readiness and finite fallback clock
        shell: cmd
        run: |
          if not exist build\\test mkdir build\\test
          javac --release 17 -encoding UTF-8 -cp build\\classes -d build\\test src\\test\\java\\org\\beckenburg\\OpeningPlaybackClockTest.java || exit /b 1
          java -Djava.awt.headless=true -ea -cp build\\classes;build\\test org.beckenburg.OpeningPlaybackClockTest || exit /b 1
      - name: Verify static fixture revisions and probe cache invalidation
        shell: cmd
        run: |
          if not exist build\test mkdir build\test
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\FixtureLightingRevisionTest.java src\test\java\org\beckenburg\PreparedFixtureProbeCacheTest.java || exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.FixtureLightingRevisionTest || exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.PreparedFixtureProbeCacheTest || exit /b 1
      - name: Verify real gameplay frame static and derived ownership partition
        shell: cmd
        run: |
          if not exist build\test mkdir build\test
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\ProductionShellOwnershipTest.java || exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.ProductionShellOwnershipTest || exit /b 1
      - name: Verify live House residency and separately retained fixture visibility
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\LiveHouseResidencyTest.java src\test\java\org\beckenburg\StationaryFixtureProbeTest.java src\test\java\org\beckenburg\StationaryDoorDependencyTest.java || exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.LiveHouseResidencyTest || exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.StationaryFixtureProbeTest || exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.StationaryDoorDependencyTest || exit /b 1
      - name: Preserve viewport profile frames, stage CSV and HUD even if another GPU check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beckenburg-van-house-viewport-profile
          path: build/e2e/viewport-profile/**
          if-no-files-found: warn
          retention-days: 14
      - name: Package actual OpenGL 3.3 backend and source assets
        shell: pwsh
        run: |
          mvn -B -ntp -f gpu-client/pom.xml -DskipTests package
          if ($LASTEXITCODE -ne 0) { throw 'GPU client Maven compilation failed' }
          if (!(Test-Path 'gpu-client/target/BeckenburgGPU.jar')) {throw 'Missing GPU client JAR'}
      - name: Assemble Windows GPU-first native launcher
        shell: pwsh
        run: |
          Copy-Item gpu-client/target/BeckenburgGPU.jar build/BeckenburgGPU.jar -Force
          New-Item -ItemType Directory -Force dist/gpu-native-validation | Out-Null
          jpackage --type app-image --name Beckenburg --input build --main-jar BeckenburgGPU.jar --dest dist/gpu-native-validation
          if ($LASTEXITCODE -ne 0) { throw 'OpenGL native package failed' }
          if (!(Test-Path 'dist/gpu-native-validation/Beckenburg/Beckenburg.exe')) {
            throw 'GPU native Windows executable missing'
          }
      - name: Launch GPU-capable native executable in explicit software recovery mode
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $begin=Get-Date
          $process=Start-Process -FilePath (Resolve-Path 'dist/gpu-native-validation/Beckenburg/Beckenburg.exe') -ArgumentList '--software' -PassThru
          try {
            $ready=$false
            $folder=Join-Path $env:USERPROFILE '.beckenburg/diagnostics'
            for ($i=0;$i -lt 120;$i++) {
              if ($process.HasExited) { throw "GPU-packaged native game exited: $($process.ExitCode)" }
              foreach ($file in @(Get-ChildItem $folder -Filter 'session-*.log' -ErrorAction SilentlyContinue)) {
                if ($file.LastWriteTime -lt $begin.AddSeconds(-2)) { continue }
                $log=Get-Content $file.FullName -Raw
                if ($log.Contains('PHASE ready') -and $log.Contains('PHASE Menu available')) {
                  $ready=$true;break
                }
              }
              if ($ready) {break}
              Start-Sleep -Milliseconds 500
            }
            if (!$ready) {throw 'GPU-bundled native app did not reach its menu through recovery route'}
            Write-Host 'PASS GPU-native Windows executable / software recovery / menu'
          } finally {
            if (!$process.HasExited) {Stop-Process -Id $process.Id -Force}
          }
      - uses: actions/upload-artifact@v4
        with:
          name: beckenburg-gpu-windows-jar
          path: gpu-client/target/BeckenburgGPU.jar
          if-no-files-found: error
  opengl-mesa-smoke:
    needs: windows-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: beckenburg-gpu-windows-jar
          path: build/gpu
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Mesa OpenGL 3.3 real engine smoke
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglu1-mesa
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a java -jar build/gpu/BeckenburgGPU.jar --gpu-smoke
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a java -jar build/gpu/BeckenburgGPU.jar --gpu-ui-smoke
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a java -Xmx3g -Dbeckenburg.gpu.residentHouse=true -Dbeckenburg.profile.depthParity=true -jar build/gpu/BeckenburgGPU.jar --live-house-profile
          test -s build/e2e/gpu/investigation-house.png
          test -s build/e2e/gpu/castle-headquarters.png
          test -s build/e2e/gpu/continuous-route.csv
          test -s build/e2e/gpu/continuous-route-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beckenburg-gpu-frame-evidence
          path: |
            build/e2e/gpu/*.png
            build/e2e/gpu/*.csv
            build/e2e/gpu/*.txt
            build/e2e/gpu/live-house/**
          if-no-files-found: warn
