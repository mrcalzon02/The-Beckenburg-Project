name: Recover original Castle resident RGB textures (nonblocking)
on:
  push:
    branches: [main]
    paths:
      - 'tools/repair_castle_sprite_art.py'
      - '.github/workflows/castle-resident-art-repair.yml'
  workflow_dispatch:
concurrency:
  group: castle-resident-source-art-repair-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  recover-and-inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible pixel-matching dependencies
        run: python -m pip install --disable-pip-version-check pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Recover from original masters, never from low-resolution RGB
        id: recover
        continue-on-error: true # A visual issue never blocks the game release.
        run: python tools/repair_castle_sprite_art.py --out build/castle-resident-art-repair --write
      - name: Record source audit results and publish only completely verified artwork
        if: always()
        run: |
          if test -f build/castle-resident-art-repair/audit.json; then
            cp build/castle-resident-art-repair/audit.json docs/development/castle-resident-art-repair-audit.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/development/castle-resident-art-repair-audit.json
          if test "${{ steps.recover.outcome }}" = success; then
            git add -- assets/runtime/castle-support-directions.zip
          fi
          if git diff --cached --quiet; then
            echo 'No new source audit or packaged sprite changes'
            exit 0
          fi
          git diff --cached --check
          git commit -m "assets(castle): source-fidelity diagnostic and verified sprite derivatives"
          git push origin HEAD:main
      - name: Upload original-vs-128x224-vs-rebuilt comparisons and matching report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: castle-residents-original-vs-old-vs-rebuilt-nonblocking
          path: build/castle-resident-art-repair/
          if-no-files-found: warn
          retention-days: 21
