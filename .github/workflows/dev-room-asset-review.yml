name: Developer Asset Room - Continuous Visual Review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/runtime/models/**'
      - 'assets/runtime/character-directions*'
      - 'assets/runtime/ghost-sprite-parts/**'
      - 'assets/runtime/elder-masters/**'
      - 'assets/runtime/*directions.zip'
      - 'src/main/java/org/beckenburg/GlbProps.java'
      - 'tools/inspect_flagged_uv.py'
      - 'development/assets/texture-review-focus.txt'
      - 'src/main/java/org/beckenburg/DirectionalSprites.java'
      - 'src/main/java/org/beckenburg/GhostSpriteAtlas.java'
      - 'src/test/java/org/beckenburg/PossessiveAtlasRuntimeTest.java'
      - 'src/test/java/org/beckenburg/TwinsAtlasRuntimeTest.java'
      - 'src/main/java/org/beckenburg/CharacterVisuals.java'
      - 'src/main/java/org/beckenburg/EquipmentModelCatalog.java'
      - 'src/main/java/org/beckenburg/LevelAssets.java'
      - 'src/main/java/org/beckenburg/LevelPlans.java'
      - 'src/main/java/org/beckenburg/DevAssetReviewCatalog.java'
      - 'src/main/java/org/beckenburg/DevAssetGalleryLayout.java'
      - 'src/test/java/org/beckenburg/DevAssetGalleryLayoutTest.java'
      - 'src/main/java/org/beckenburg/DevAssetShowroom.java'
      - 'src/test/java/org/beckenburg/HollowCreekDevCatalogClassificationTest.java'
      - 'src/test/java/org/beckenburg/HollowCreekBillboardAlphaRuntimeTest.java'
      - 'src/main/java/org/beckenburg/DevAssetShowroom.java'
      - 'src/main/java/org/beckenburg/DevTerrainTopologyLab.java'
      - 'src/main/java/org/beckenburg/DevInfrastructureShowcase.java'
      - 'src/main/java/org/beckenburg/TerrainRiverWaterSockets.java'
      - 'water-module/src/main/java/dev/mrcalzon/water/WaterEditorModel.java'
      - 'water-module/src/main/java/dev/mrcalzon/water/WaterCanvas.java'
      - 'src/test/java/org/beckenburg/DevInfrastructureShowcaseTest.java'
      - 'water-module/src/main/java/dev/mrcalzon/water/WaterTerrainSnap.java'
      - 'src/main/java/org/beckenburg/editor/AdaptiveTerrainTopology.java'
      - 'src/main/java/org/beckenburg/SceneRenderer.java'
      - 'src/test/java/org/beckenburg/CastlePrimitiveRuntimeFitTest.java'
      - 'src/test/java/org/beckenburg/CastleRelicSourceDecodeTest.java'
      - 'development/levels/primitive-props-v1/relic-review/**'
      - 'src/test/java/org/beckenburg/CastlePortalTrimTest.java'
      - 'development/levels/primitive-props-v1/models/**'
      - 'development/levels/primitive-props-v1/refinement/**'
      - 'src/test/java/org/beckenburg/DevRefinementReviewTest.java'
      - 'development/levels/primitive-props-v1/previews/**'
      - '.github/workflows/dev-room-asset-review.yml'

permissions:
  contents: read

concurrency:
  group: beckenburg-dev-room-main
  cancel-in-progress: true

jobs:
  diagnostic-gallery:
    name: Actual textured renderer screenshots (advisory art check)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and package actual assets (functional)
        shell: cmd
        run: build.cmd e2e
      - name: Verify reusable three-storey gallery layout and deterministic slot mapping
        shell: cmd
        run: |
          if not exist build\\dev-room\\test mkdir build\\dev-room\\test
          javac --release 17 -encoding UTF-8 -cp build\\beckenburg-game.jar -d build\\dev-room\\test src\\test\\java\\org\\beckenburg\\DevAssetGalleryLayoutTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\\beckenburg-game.jar;build\\dev-room\\test org.beckenburg.DevAssetGalleryLayoutTest
          if errorlevel 1 exit /b 1
      - name: Capture all three model-gallery floors and source-only refinement bays (advisory)
        shell: pwsh
        run: |
          & java '-Djava.awt.headless=true' -cp 'build/beckenburg-game.jar' 'org.beckenburg.DevAssetShowroom' '--dev-room' '--gallery-capture' '--kind=SOURCE_ONLY' '--limit=72' '--output=build/dev-room/multi-floor-source-gallery'
          if ($LASTEXITCODE -ne 0) { throw 'Multi-floor source gallery renderer capture failed' }
          $shots = @(Get-ChildItem 'build/dev-room/multi-floor-source-gallery' -Filter '*.png')
          if ($shots.Count -ne 12) { throw "Expected 12 real gallery bay PNGs across three floors; got $($shots.Count)" }
          $positions = @(Import-Csv 'build/dev-room/multi-floor-source-gallery/gallery-placements.csv')
          if ($positions.Count -ne 72) { throw "Expected 72 stable inspection slots, got $($positions.Count)" }
          if (@($positions | Where-Object { $_.floor -eq '3' }).Count -ne 24) { throw 'Third floor models were not indexed' }
          & java '-Djava.awt.headless=true' -cp 'build/beckenburg-game.jar' 'org.beckenburg.DevAssetShowroom' '--dev-room' '--gallery-capture' '--filter=level_blockout_refined_' '--limit=72' '--output=build/dev-room/multi-floor-refinements'
          if ($LASTEXITCODE -ne 0) { throw 'Refinement gallery renderer capture failed' }
          $refined = @(Import-Csv 'build/dev-room/multi-floor-refinements/gallery-placements.csv')
          if ($refined.Count -ne 15) { throw "Expected 15 source-only refinements, got $($refined.Count)" }
          Write-Host 'PASS: twelve multi-floor source-bay captures and fifteen refinement placements'
      - name: Check actual Twins source alpha strips with game decoder (advisory)
        continue-on-error: true
        shell: cmd
        run: |
          if not exist build\\test mkdir build\\test
          javac --release 17 -encoding UTF-8 -cp build\\beckenburg-game.jar -d build\\test src\\test\\java\\org\\beckenburg\\TwinsAtlasRuntimeTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\\beckenburg-game.jar;build\\test org.beckenburg.TwinsAtlasRuntimeTest
          if errorlevel 1 exit /b 1
      - name: Check packed Possessive source alpha with actual game decoder (advisory)
        continue-on-error: true
        shell: cmd
        run: |
          if not exist build\\test mkdir build\\test
          javac --release 17 -encoding UTF-8 -cp build\\beckenburg-game.jar -d build\\test src\\test\\java\\org\\beckenburg\\PossessiveAtlasRuntimeTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\\beckenburg-game.jar;build\\test org.beckenburg.PossessiveAtlasRuntimeTest
          if errorlevel 1 exit /b 1
      - name: Verify real native tree BLEND cutouts and original source alpha (advisory)
        continue-on-error: true
        shell: cmd
        run: |
          if not exist build\\dev-room\\test mkdir build\\dev-room\\test
          javac --release 17 -encoding UTF-8 -cp build\\beckenburg-game.jar -d build\\dev-room\\test src\\test\\java\\org\\beckenburg\\HollowCreekBillboardAlphaRuntimeTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\\beckenburg-game.jar;build\\dev-room\\test org.beckenburg.HollowCreekBillboardAlphaRuntimeTest
          if errorlevel 1 exit /b 1
      - name: Validate Hollow Creek source approval and catalog membership (advisory)
        shell: cmd
        run: |
          if not exist build\\dev-room\\test mkdir build\\dev-room\\test
          javac --release 17 -encoding UTF-8 -cp build\\beckenburg-game.jar -d build\\dev-room\\test src\\test\\java\\org\\beckenburg\\HollowCreekDevCatalogClassificationTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\\beckenburg-game.jar;build\\dev-room\\test org.beckenburg.HollowCreekDevCatalogClassificationTest
          if errorlevel 1 exit /b 1
      - name: Decode and texture-sample all 22 relic/crypt GLBs using actual game importer (advisory)
        shell: cmd
        run: |
          if not exist build\\dev-room\\test mkdir build\\dev-room\\test
          javac --release 17 -encoding UTF-8 -cp build\\beckenburg-game.jar -d build\\dev-room\\test src\\test\\java\\org\\beckenburg\\CastleRelicSourceDecodeTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\\beckenburg-game.jar;build\\dev-room\\test org.beckenburg.CastleRelicSourceDecodeTest
          if errorlevel 1 exit /b 1
      - name: Decode all refined map GLBs in actual game importer without runtime registration (advisory)
        shell: cmd
        run: |
          if not exist build\\dev-room\\test mkdir build\\dev-room\\test
          javac --release 17 -encoding UTF-8 -cp build\\beckenburg-game.jar -d build\\dev-room\\test src\\test\\java\\org\\beckenburg\\DevRefinementReviewTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\\beckenburg-game.jar;build\\dev-room\\test org.beckenburg.DevRefinementReviewTest
          if errorlevel 1 exit /b 1
      - name: Native Castle prototype bounds, egress and real-renderer screenshot study (advisory)
        shell: cmd
        run: |
          if not exist build\\dev-room\\test mkdir build\\dev-room\\test
          javac --release 17 -encoding UTF-8 -cp build\\beckenburg-game.jar -d build\\dev-room\\test src\\test\\java\\org\\beckenburg\\CastlePrimitiveRuntimeFitTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\\beckenburg-game.jar;build\\dev-room\\test org.beckenburg.CastlePrimitiveRuntimeFitTest build\\dev-room\\native-castle-graybox
          if errorlevel 1 exit /b 1
      - name: Real DEV room four-angle captures of individual primitives and complete study layouts (advisory)
        continue-on-error: true
        shell: pwsh
        run: |
          $models = @('level_blockout_quartermaster_counter','level_blockout_privacy_screen',
              'level_blockout_lookout_spotter','level_blockout_mine_ventilation',
              'level_blockout_layout_castle','level_blockout_layout_wld-04',
              'level_blockout_relic_mourning_locket','level_blockout_relic_votive_bell',
              'level_blockout_relic_black_mirror','level_blockout_relic_reliquary_box',
              'level_blockout_relic_pilgrim_lantern','level_blockout_relic_bound_folio',
              'level_blockout_relic_open_guard','level_blockout_relic_containment',
              'level_blockout_sarcophagus_plain','level_blockout_sarcophagus_inscribed',
              'level_blockout_sarcophagus_effigy',
              'level_blockout_refined_castle_open_crypt_niche',
              'level_blockout_refined_castle_sarcophagus_bier',
              'level_blockout_refined_castle_candelabrum',
              'level_blockout_refined_house_iron_stove',
              'level_blockout_refined_school_coat_rail',
              'level_blockout_refined_mortuary_instrument_cart',
              'level_blockout_refined_rail_mechanical_semaphore',
              'level_blockout_refined_lighthouse_fresnel_cage',
              'level_blockout_refined_mine_open_ore_cart',
              'level_blockout_refined_sawmill_guarded_blade_table',
              'level_blockout_refined_cannery_suspended_hooks',
              'level_blockout_refined_prison_visitation_grille',
              'level_blockout_refined_camp_timber_washstand',
              'level_blockout_refined_wharf_mooring_bollard',
              'level_blockout_refined_battery_vent_cage',
              'level_blockout_kit_refined_p01',
              'level_blockout_kit_refined_p02',
              'level_blockout_kit_refined_p03')
          foreach ($model in $models) {
            & java '-Djava.awt.headless=true' -cp 'build/beckenburg-game.jar' 'org.beckenburg.DevAssetShowroom' '--dev-room' '--capture' "--asset=$model" "--output=build/dev-room/primitive-studies/$model"
            if ($LASTEXITCODE -ne 0) { Write-Warning "Primitive asset four-view capture failed: $model" }
          }
      - name: Verify water socket connection and actual DEV sample construction
        shell: cmd
        run: |
          if not exist build\\dev-room\\test mkdir build\\dev-room\\test
          javac --release 17 -encoding UTF-8 -cp build\\beckenburg-game.jar -d build\\dev-room\\test src\\test\\java\\org\\beckenburg\\DevInfrastructureShowcaseTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\\beckenburg-game.jar;build\\dev-room\\test org.beckenburg.DevInfrastructureShowcaseTest
          if errorlevel 1 exit /b 1
      - name: Capture existing DEV level's rail road river and vegetation samples (advisory)
        shell: pwsh
        continue-on-error: true
        run: |
          & java '-Djava.awt.headless=true' -cp 'build\\beckenburg-game.jar' org.beckenburg.DevAssetShowroom --dev-room --infrastructure-demo-capture --output=build/dev-room
          if ($LASTEXITCODE -ne 0) { Write-Warning "Infrastructure DEV room screenshots unavailable; source functionality is checked separately." }
      - name: Enumerate every runtime model/character and take real scene captures
        shell: pwsh
        continue-on-error: true
        run: |
          & java '-Djava.awt.headless=true' -cp 'build\beckenburg-game.jar' org.beckenburg.InvestigationGame --dev-room --capture --output=build/dev-room
          if ($LASTEXITCODE -ne 0) { Write-Warning "Advisory art preview had errors. Inspect logs and screenshots." }
          if (Test-Path 'build/dev-room/inventory.csv') {
            Write-Output 'Representative asset failures or source-registration findings:'
            Get-Content 'build/dev-room/inventory.csv' |
              Select-String ',MISSING,|,REVIEW_UV,|,REVIEW_REGISTRATION,' |
              Select-Object -First 32
          }
      - name: Capture opt-in adaptive topology from the real DEV renderer (advisory)
        continue-on-error: true
        shell: pwsh
        run: |
          & java '-Djava.awt.headless=true' -cp 'build\beckenburg-game.jar' org.beckenburg.DevAssetShowroom --dev-room --terrain-qa-capture --output=build/dev-room
          if ($LASTEXITCODE -ne 0) { Write-Warning "Terrain topology diagnostic capture failed; inspect source and render logs." }
      - name: Extract source PNG atlases and actual UV island overlays (advisory)
        shell: pwsh
        continue-on-error: true
        run: |
          python tools/inspect_flagged_uv.py --output build/dev-room/source-uv
          if ($LASTEXITCODE -ne 0) { Write-Warning "Source UV diagnostics unavailable; release unaffected." }
      - name: Capture legacy inverted-V book control against corrected normal runtime (advisory) (advisory)
        shell: pwsh
        continue-on-error: true
        run: |
          $ids = @('open_book_mp_1','book_mp_2','book_mp_3','book_mp_4','book_mp_5','blender_ghost_writing_book_2')
          foreach ($id in $ids) {
            & java '-Djava.awt.headless=true' '-Dbeckenburg.devroom.legacyBottomLeftUV=true' -cp 'build\beckenburg-game.jar' 'org.beckenburg.DevAssetShowroom' '--dev-room' '--capture' "--asset=$id" "--output=build/dev-room/book-uv-legacy/$id"
            if ($LASTEXITCODE -ne 0) { Write-Warning "Book atlas A/B preview unavailable: $id" }
          }
      - name: Capture legacy inverted-V controls for fireplace, TV and equipment (advisory) (advisory)
        shell: pwsh
        continue-on-error: true
        run: |
          $ids = @('level_fireplace','tv_mp_1','blender_health_supplies_1','blender_igniter_2','blender_igniter_2_lit','blender_sanity_medication_2')
          foreach ($id in $ids) {
            & java '-Djava.awt.headless=true' '-Dbeckenburg.devroom.legacyBottomLeftUV=true' -cp 'build\beckenburg-game.jar' 'org.beckenburg.DevAssetShowroom' '--dev-room' '--capture' "--asset=$id" "--output=build/dev-room/remaining-uv-legacy/$id"
            if ($LASTEXITCODE -ne 0) { Write-Warning "UV-origin comparison unavailable: $id" }
          }
      - name: Record source revision
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'build/dev-room' | Out-Null
          "source=CI" | Set-Content 'build/dev-room/revision.txt'
      - name: Upload real in-engine PNG screenshots and per-asset diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beckenburg-dev-asset-room
          path: build/dev-room/
          if-no-files-found: warn
          retention-days: 21
