name: Editor Agent Service Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/org/beckenburg/*EditorAgent*.java'
      - 'src/main/java/org/beckenburg/EditorAgentCli.java'
      - 'src/main/java/org/beckenburg/HeadlessMaterialEditor.java'
      - 'src/main/java/org/beckenburg/MaterialEditorAgent.java'
      - 'src/main/java/org/beckenburg/editor/EditorObservationBridge.java'
      - 'src/main/java/org/beckenburg/editor/EditorAgentProtocol.java'
      - 'src/main/java/org/beckenburg/editor/EditorRequestJournal.java'
      - 'src/main/java/org/beckenburg/DeveloperLevelEditor.java'
      - 'src/main/java/org/beckenburg/EditorPlaytest.java'
      - 'src/main/java/org/beckenburg/CastleHubPanel.java'
      - 'src/main/java/org/beckenburg/GhostPracticePanel.java'
      - 'src/main/java/org/beckenburg/AssetImportDialog.java'
      - 'src/main/java/org/beckenburg/MaterialReview*.java'
      - 'src/test/java/org/beckenburg/MaterialReviewMipTest.java'
      - 'src/main/java/org/beckenburg/GlbProps.java'
      - 'src/main/java/org/beckenburg/SceneRenderer.java'
      - 'src/main/java/org/beckenburg/editor/EditorMaterialWorkspace.java'
      - 'src/main/java/org/beckenburg/editor/EditorTopologyProject.java'
      - 'src/test/java/org/beckenburg/G2TexturedModelGuiTest.java'
      - 'src/test/java/org/beckenburg/editor/EditorMaterialPencilTest.java'
      - 'src/main/java/org/beckenburg/LevelAuthoringSession.java'
      - 'src/main/java/org/beckenburg/LevelPlans.java'
      - 'src/main/java/org/beckenburg/UserLevelLibrary.java'
      - 'src/main/java/org/beckenburg/HouseSourceVersions.java'
      - 'src/main/java/org/beckenburg/HouseRebuildUpgrade.java'
      - 'src/main/java/org/beckenburg/HouseAuthoringAttachments.java'
      - 'src/main/java/org/beckenburg/GlbProps.java'
      - 'src/main/java/org/beckenburg/SceneRenderer.java'
      - 'src/main/java/org/beckenburg/CastleLevelEdits.java'
      - 'src/main/java/org/beckenburg/editor/EditorAgentService.java'
      - 'src/main/java/org/beckenburg/editor/EditorHistory.java'
      - 'src/main/java/org/beckenburg/editor/EditorDocumentStore.java'
      - 'src/main/java/org/beckenburg/editor/RuntimeSceneDocument.java'
      - 'src/test/java/org/beckenburg/EditorAgent*.java'
      - 'src/test/java/org/beckenburg/LevelAuthoringIdentityTest.java'
      - 'src/test/java/org/beckenburg/HouseTemplateCompatibilityTest.java'
      - 'src/test/java/org/beckenburg/HouseRebuildUpgradeTest.java'
      - 'src/test/java/org/beckenburg/EditorSceneRetentionTest.java'
      - 'src/test/java/org/beckenburg/SourceImageSharingTest.java'
      - 'src/test/java/org/beckenburg/LevelAuthoringRecoveryTest.java'
      - 'tools/verify_editor_agent_host.cmd'
      - 'tools/verify_editor_agent_cli.py'
      - 'tools/verify_mesh_agent_cli.py'
      - 'tools/editor_mcp.py'
      - 'tools/editor_mcp_requirements.txt'
      - 'tools/verify_editor_mcp.py'
      - 'tools/verify_installed_editor_mcp.ps1'
      - 'src/test/java/org/beckenburg/InstalledEditorMcpTest.java'
      - 'installer/beckenburg.iss'
      - '.github/workflows/editor-agent-service.yml'
  workflow_dispatch:
    inputs:
      run_ollama_pilot:
        description: 'Exercise one bounded School editor change using local Ollama'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native-editor-service:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build actual host and resources
        shell: cmd
        run: call build.cmd package
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MCP SDK for the stdio client and adapter
        run: python -m pip install -r tools/editor_mcp_requirements.txt
      - name: Verify bounded Ollama planner safeguards
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_ollama_pilot) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ollama-editor-pilot]')) }}
        shell: pwsh
        run: python tools/ollama_editor_pilot.py --self-test
      - name: Prepare loopback Ollama for bounded editor pilot
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_ollama_pilot) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ollama-editor-pilot]')) }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:OLLAMA_HOST = '127.0.0.1:11434'
          $env:OLLAMA_MODELS = Join-Path $env:RUNNER_TEMP 'ollama-models'
          $toolDir = Join-Path $env:RUNNER_TEMP 'beckenburg-ollama'
          $exe = Join-Path $toolDir 'ollama.exe'
          if (-not (Test-Path $exe)) {
            $archive = Join-Path $env:RUNNER_TEMP 'ollama-windows-amd64.zip'
            Invoke-WebRequest -Uri 'https://github.com/ollama/ollama/releases/latest/download/ollama-windows-amd64.zip' -OutFile $archive
            Expand-Archive -Path $archive -DestinationPath $toolDir -Force
          }
          if (-not (Test-Path $exe)) { throw 'Official Ollama CLI missing after extraction' }
          Start-Process -FilePath $exe -ArgumentList 'serve' -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'ollama-stdout.log') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'ollama-stderr.log') | Out-Null
          $ready = $false
          for ($i=0; $i -lt 45; $i++) {
            try { Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/tags' -TimeoutSec 3 | Out-Null; $ready = $true; break }
            catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ready) { throw 'Ollama loopback server did not become ready' }
          & $exe pull qwen2.5:0.5b
          if ($LASTEXITCODE -ne 0) { throw 'Could not pull the pinned pilot model' }
      - name: Test one Ollama-directed native School editor change
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_ollama_pilot) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ollama-editor-pilot]')) }}
        shell: pwsh
        run: python tools/ollama_editor_pilot.py --site SCHOOL --output build/editor-agent-evidence/ollama-pilot
      - name: Verify native service, actual Windows editor and headless protocol
        env:
          EDITOR_MCP_PYTHON: python
        shell: cmd
        run: call tools\verify_editor_agent_host.cmd
      - name: Verify MCP repair in the installed Windows editor
        shell: pwsh
        run: ./tools/verify_installed_editor_mcp.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-agent-evidence
          path: build/editor-agent-evidence
