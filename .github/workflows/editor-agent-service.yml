name: Editor Agent Service Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/org/beckenburg/*EditorAgent*.java'
      - 'src/main/java/org/beckenburg/EditorAgentCli.java'
      - 'src/main/java/org/beckenburg/DeveloperLevelEditor.java'
      - 'src/main/java/org/beckenburg/LevelAuthoringSession.java'
      - 'src/main/java/org/beckenburg/CastleLevelEdits.java'
      - 'src/main/java/org/beckenburg/editor/EditorAgentService.java'
      - 'src/main/java/org/beckenburg/editor/EditorHistory.java'
      - 'src/test/java/org/beckenburg/EditorAgent*.java'
      - 'src/test/java/org/beckenburg/LevelAuthoringIdentityTest.java'
      - '.github/workflows/editor-agent-service.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-editor-service:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build actual host and resources
        shell: cmd
        run: call build.cmd package
      - name: Compile service acceptance tests
        shell: cmd
        run: |
          if not exist build\test mkdir build\test
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\EditorAgentServiceTest.java src\test\java\org\beckenburg\EditorAgentGuiTest.java src\test\java\org\beckenburg\LevelAuthoringIdentityTest.java src\test\java\org\beckenburg\VerificationPreferencesFactory.java
          if errorlevel 1 exit /b 1
      - name: Verify actual runtime transactions and persistence
        shell: cmd
        run: java -Djava.awt.headless=true -Djava.util.prefs.PreferencesFactory=org.beckenburg.VerificationPreferencesFactory -ea -cp build\classes;build\test org.beckenburg.EditorAgentServiceTest
      - name: Verify stable native identities and USER project ownership
        shell: cmd
        run: java -Djava.awt.headless=true -Djava.util.prefs.PreferencesFactory=org.beckenburg.VerificationPreferencesFactory -ea -cp build\classes;build\test org.beckenburg.LevelAuthoringIdentityTest
      - name: Verify real editor and human undo with native renderer captures
        shell: cmd
        run: java -Djava.util.prefs.PreferencesFactory=org.beckenburg.VerificationPreferencesFactory -ea -cp build\classes;build\test org.beckenburg.EditorAgentGuiTest
      - name: Verify headless public protocol in independent processes
        run: python tools/verify_editor_agent_cli.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-agent-evidence
          path: build/editor-agent-evidence
