name: Recover and visually test Castle NPC silhouettes (nonblocking)
on:
  push:
    branches: [main]
    paths:
      - 'tools/restore_castle_transparency.py'
      - '.github/workflows/castle-alpha-recovery.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: castle-alpha-restoration-preview
  cancel-in-progress: true
jobs:
  source-matte:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0 numpy==2.2.6 scipy==1.15.3 opencv-python-headless==4.11.0.86
      - name: Re-segment all sixteen character frames using canonical source RGB
        id: matte
        continue-on-error: true # Pure appearance does not block functional release.
        run: python tools/restore_castle_transparency.py --out development/quality/castle-resident-art/alpha-proposals/previews --write
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Capture real game-engine photos of newly repaired residents
        id: ingame
        continue-on-error: true # Cosmetic visual QA; no release blocking.
        run: |
          sh build.sh --capture-only
          mkdir -p build/test
          javac --release 17 -encoding UTF-8 -cp build/classes -d build/test src/test/java/org/beckenburg/CastleResidentArtRenderAudit.java
          java -Djava.awt.headless=true -cp build/classes:build/test org.beckenburg.CastleResidentArtRenderAudit build/castle-resident-art-render
          mkdir -p development/quality/castle-resident-art/captures
          cp build/castle-resident-art-render/*.png development/quality/castle-resident-art/captures/
          cp build/castle-resident-art-render/captures.csv development/quality/castle-resident-art/captures.csv
      - name: Publish rebuilt character alpha and actual in-game comparison captures
        if: steps.matte.outcome == 'success'
        continue-on-error: true
        run: |
          python tools/build_development_gallery.py
          python tools/build_development_gallery.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/runtime/castle-support-directions.zip assets/runtime/castle-support-alpha-repair-manifest.json
          git add -- development/quality/castle-resident-art/alpha-proposals/previews development/gallery/index.json beckenburg-development-gallery.html
          if test "${{ steps.ingame.outcome }}" = "success"; then
            git add -- development/quality/castle-resident-art/captures.csv development/quality/castle-resident-art/captures
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(castle): restore four-resident alpha masks from original master art and capture game screens"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: castle-npc-new-alpha-masks-review
          path: |
            development/quality/castle-resident-art/alpha-proposals/previews
            build/castle-resident-art-render/
          if-no-files-found: warn
