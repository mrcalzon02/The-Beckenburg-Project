name: Modular Level Editor Standalone
on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/org/beckenburg/editor/**'
      - 'src/test/java/org/beckenburg/editor/**'
      - 'tools/build-editor-kit.cmd'
      - 'tools/build-editor-kit.sh'
      - '.github/workflows/standalone-editor-kit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-compiler-and-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build reusable jar without game files or 3D assets
        shell: cmd
        run: call tools\build-editor-kit.cmd
      - name: Verify persisted railway meshes and shared scene publication
        shell: cmd
        run: |
          if not exist build\editor-kit\test mkdir build\editor-kit\test
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\TerrainRailScenePackageTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.TerrainRailScenePackageTest
          if errorlevel 1 exit /b 1
      - name: Prove editor library works with an unrelated project adapter
        shell: cmd
        run: |
          if not exist build\editor-kit\test mkdir build\editor-kit\test
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\EditorCorePortabilityTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.EditorCorePortabilityTest
          if errorlevel 1 exit /b 1
      - name: Verify bounded native-mesh half-edge adjacency and topology diagnostics
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\EditorMeshTopologyTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.EditorMeshTopologyTest
          if errorlevel 1 exit /b 1
          java -Xmx256m -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.EditorMeshTopologyTest --stress
          if errorlevel 1 exit /b 1
      - name: Verify indexed editable topology and journaled native save compatibility
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\EditorTopologyProjectTest.java
          if errorlevel 1 exit /b 1
          java -Xmx256m -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.EditorTopologyProjectTest
          if errorlevel 1 exit /b 1
      - name: Verify five parametric primitives through native topology and history
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\EditorMeshPrimitivesTest.java
          if errorlevel 1 exit /b 1
          java -Xmx256m -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.EditorMeshPrimitivesTest
          if errorlevel 1 exit /b 1
      - name: Verify native indexed triangle picking in four projections
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\EditorMeshPickingTest.java
          if errorlevel 1 exit /b 1
