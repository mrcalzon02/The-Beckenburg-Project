name: Modular Level Editor Standalone
on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/org/beckenburg/editor/**'
      - 'src/test/java/org/beckenburg/editor/**'
      - 'tools/build-editor-kit.cmd'
      - 'tools/build-editor-kit.sh'
      - '.github/workflows/standalone-editor-kit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-compiler-and-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build reusable jar without game files or 3D assets
        shell: cmd
        run: call tools\build-editor-kit.cmd
      - name: Prove editor library works with an unrelated project adapter
        shell: cmd
        run: |
          if not exist build\editor-kit\test mkdir build\editor-kit\test
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\EditorCorePortabilityTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.EditorCorePortabilityTest
          if errorlevel 1 exit /b 1
      - name: Verify game-independent runtime scene contract
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\RuntimeSceneContractTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.RuntimeSceneContractTest
          if errorlevel 1 exit /b 1
      - name: Verify portable model import, head over-regression and GLB export
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\\editor-kit\\LevelEditorKit-Java17.jar -d build\\editor-kit\\test src\\test\\java\\org\\beckenburg\\editor\\EditorMeshPipelineTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\\editor-kit\\LevelEditorKit-Java17.jar;build\\editor-kit\\test org.beckenburg.editor.EditorMeshPipelineTest
          if errorlevel 1 exit /b 1
      - name: Verify animation clip timeline, reduction and save/load
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\EditorAnimationClipTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.EditorAnimationClipTest
          if errorlevel 1 exit /b 1
      - name: Verify non-destructive PCM sound profile and campaign state authoring
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\EditorSoundProfileTest.java src\test\java\org\beckenburg\editor\EditorCampaignFlowTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.EditorSoundProfileTest
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.EditorCampaignFlowTest
          if errorlevel 1 exit /b 1
      - name: Verify billboard palette export and source protection
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\EditorBillboardProfileTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.EditorBillboardProfileTest
          if errorlevel 1 exit /b 1
      - name: Verify optional environment modules in isolation
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\EnvironmentModulesContractTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.EnvironmentModulesContractTest
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: portable-level-editor-java17
          path: build/editor-kit/LevelEditorKit-Java17.jar
          if-no-files-found: error
