          javac --release 17 -encoding UTF-8 -cp build\editor-kit\LevelEditorKit-Java17.jar -d build\editor-kit\test src\test\java\org\beckenburg\editor\EditorObjIdentityTest.java
          if errorlevel 1 exit /b 1
