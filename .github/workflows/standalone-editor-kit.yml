          if errorlevel 1 exit /b 1
          java -Xmx256m -Djava.awt.headless=true -ea -cp build\editor-kit\LevelEditorKit-Java17.jar;build\editor-kit\test org.beckenburg.editor.EditorMeshPickingTest --stress
          if errorlevel 1 exit /b 1
      - name: Verify authored OBJ indices and native UV seam identities
        shell: cmd
