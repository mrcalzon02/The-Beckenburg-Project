name: Focused Beckenburg Castle Repair Checks
on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/org/beckenburg/CastleHub*.java'
      - 'src/main/java/org/beckenburg/SceneRenderer.java'
      - 'src/main/java/org/beckenburg/FixtureLighting.java'
      - 'src/main/java/org/beckenburg/CastleHubArchitecturalPlan.java'
      - 'src/test/java/org/beckenburg/LightingOcclusionRepairTest.java'
      - 'src/test/java/org/beckenburg/CastleLightingPlacementRepairTest.java'
      - 'src/test/java/org/beckenburg/CastleFurnitureWallAuditTest.java'
      - 'src/main/java/org/beckenburg/CastleLevelEdits.java'
      - 'src/main/java/org/beckenburg/DeveloperLevelEditor.java'
      - 'src/main/java/org/beckenburg/GhostAiRuleAdapter.java'
      - 'src/main/java/org/beckenburg/GhostAiRuleLab.java'
      - 'src/test/java/org/beckenburg/GhostAiRuleAdapterTest.java'
      - 'src/main/java/org/beckenburg/GhostAiNavigationAudit.java'
      - 'src/main/java/org/beckenburg/LanGhostPursuit.java'
      - 'src/main/java/org/beckenburg/LanHost.java'
      - 'src/test/java/org/beckenburg/GhostAiNavigationAuditTest.java'
      - 'src/main/java/org/beckenburg/GhostAiScenarioRunner.java'
      - 'src/main/java/org/beckenburg/LanGhostPursuit.java'
      - 'src/test/java/org/beckenburg/GhostAiScenarioRunnerTest.java'
      - 'src/test/java/org/beckenburg/LanGhostPursuitTest.java'
      - 'src/test/java/org/beckenburg/GhostAiScenarioRunnerTest.java'
      - 'src/main/java/org/beckenburg/AssetImportDialog.java'
      - 'src/main/java/org/beckenburg/ImportedAssetLibrary.java'
      - 'src/main/java/org/beckenburg/CastleEditorAudit.java'
      - 'src/test/java/org/beckenburg/CastleEditorAuditTest.java'
      - 'src/test/java/org/beckenburg/AssetImportRuntimeTest.java'
      - 'src/main/java/org/beckenburg/editor/**'
      - 'src/main/java/org/beckenburg/CastleEditorProject.java'
      - 'src/test/java/org/beckenburg/CastleEditorGeometryTest.java'
      - 'src/test/java/org/beckenburg/editor/EditorCorePortabilityTest.java'
      - 'src/main/java/org/beckenburg/InvestigationGame.java'
      - 'src/main/java/org/beckenburg/GraphicsOptions.java'
      - 'src/main/java/org/beckenburg/BeckenburgDeveloperTrace.java'
      - 'src/main/java/org/beckenburg/SiteCatalog.java'
      - 'src/test/java/org/beckenburg/GraphicsOptionsTest.java'
      - 'src/test/java/org/beckenburg/RendererVisibilityTest.java'
      - 'installer/beckenburg.iss'
      - '.github/workflows/ship-installer.yml'
      - 'src/test/java/org/beckenburg/DeveloperEditorLaunchTest.java'
      - 'src/main/java/org/beckenburg/CastleHubMap.java'
      - 'src/test/java/org/beckenburg/FlaggedSourceAtlasRuntimeTest.java'
      - 'src/main/java/org/beckenburg/GlbProps.java'
      - 'src/test/java/org/beckenburg/DeveloperLevelEditorDataTest.java'
      - 'src/main/java/org/beckenburg/GlbProps.java'
      - 'src/main/java/org/beckenburg/DirectionalSprites.java'
      - 'src/main/java/org/beckenburg/CastleCourtyardPaving.java'
      - 'src/test/java/org/beckenburg/ImportedBookMaterialTest.java'
      - 'src/test/java/org/beckenburg/CharacterBillboardAnchorTest.java'
      - 'src/test/java/org/beckenburg/CastleLiveRepairVisualTest.java'
      - 'src/test/java/org/beckenburg/CastleResidentArtRenderAudit.java'
      - 'src/main/java/org/beckenburg/CastleSurroundings.java'
      - 'src/main/java/org/beckenburg/VanArrivalStreet.java'
      - 'tools/ggbot_blend_export.py'
      - 'build.cmd'
      - 'src/main/java/org/beckenburg/CampaignStorePanel.java'
      - 'src/test/java/org/beckenburg/CastleLiveRepairTest.java'
      - 'src/test/java/org/beckenburg/CastleHeadquartersRevisionTest.java'
      - 'src/test/java/org/beckenburg/CastlePortalSlotTest.java'
      - '.github/workflows/focused-castle-repairs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  focused-castle-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile actual game and package assets without broad regression suite
        shell: cmd
        run: call build.cmd package
      - name: Compile and run focused castle defect regression
        shell: cmd
        run: |
          if not exist build\test mkdir build\test
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\CastleLiveRepairTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.CastleLiveRepairTest
          if errorlevel 1 exit /b 1
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\LightingOcclusionRepairTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.LightingOcclusionRepairTest
          if errorlevel 1 exit /b 1
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\CastleLightingPlacementRepairTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.CastleLightingPlacementRepairTest
          if errorlevel 1 exit /b 1
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\CastleFurnitureWallAuditTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.CastleFurnitureWallAuditTest
          if errorlevel 1 exit /b 1
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\CastleHeadquartersRevisionTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.CastleHeadquartersRevisionTest
          if errorlevel 1 exit /b 1
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\CastlePortalSlotTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.CastlePortalSlotTest
          if errorlevel 1 exit /b 1
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\RendererVisibilityTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.RendererVisibilityTest
          if errorlevel 1 exit /b 1
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\GraphicsOptionsTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.GraphicsOptionsTest
          if errorlevel 1 exit /b 1
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\DeveloperLevelEditorDataTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.DeveloperLevelEditorDataTest
          if errorlevel 1 exit /b 1
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\DeveloperEditorLaunchTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.DeveloperEditorLaunchTest
          if errorlevel 1 exit /b 1
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\CastleEditorGeometryTest.java src\test\java\org\beckenburg\editor\EditorCorePortabilityTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.CastleEditorGeometryTest
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.editor.EditorCorePortabilityTest
          if errorlevel 1 exit /b 1
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\GgBotBlenderSourceUvTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.GgBotBlenderSourceUvTest
          if errorlevel 1 exit /b 1
      - name: Verify switch model scales, wall-facing and captured in-game screenshot
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\CastleSwitchMountTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.CastleSwitchMountTest
          if errorlevel 1 exit /b 1
      - name: Verify on-demand editor audit (diagnostic only)
        continue-on-error: true
        shell: cmd
        run: |
          if not exist build\\test mkdir build\\test
          javac --release 17 -encoding UTF-8 -cp build\\classes -d build\\test src\\test\\java\\org\\beckenburg\\CastleEditorAuditTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\\classes;build\\test org.beckenburg.CastleEditorAuditTest
          if errorlevel 1 exit /b 1
      - name: Verify imported GLB can render and persist in the live Castle
        continue-on-error: true
        shell: cmd
        run: |
          if not exist build\\test mkdir build\\test
          javac --release 17 -encoding UTF-8 -cp build\\classes -d build\\test src\\test\\java\\org\\beckenburg\\AssetImportRuntimeTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\\classes;build\\test org.beckenburg.AssetImportRuntimeTest
          if errorlevel 1 exit /b 1
      - name: Verify canonical ghost species/host AI rule reading (diagnostic)
        continue-on-error: true
        shell: cmd
        run: |
          if not exist build\test mkdir build\test
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\GhostAiRuleAdapterTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.GhostAiRuleAdapterTest
          if errorlevel 1 exit /b 1
      - name: Diagnostic — canonical ghost portal/acoustic integrity and AI timings
        continue-on-error: true
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\GhostAiNavigationAuditTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.GhostAiNavigationAuditTest
          if errorlevel 1 exit /b 1
      - name: Enforce physical-victim gate against synthetic sound and STRIKE-biased AI
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\GhostAiScenarioRunnerTest.java src\test\java\org\beckenburg\LanGhostPursuitTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.GhostAiScenarioRunnerTest
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.LanGhostPursuitTest
          if errorlevel 1 exit /b 1
      - name: Book source-atlas and NPC world-pivot diagnostics
        continue-on-error: true
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\ImportedBookMaterialTest.java src\test\java\org\beckenburg\CharacterBillboardAnchorTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.ImportedBookMaterialTest
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.CharacterBillboardAnchorTest
      - name: Check five flagged original GLB atlas bindings (advisory)
        continue-on-error: true
        shell: cmd
        run: |
          if not exist build\\test mkdir build\\test
          javac --release 17 -encoding UTF-8 -cp build\\classes -d build\\test src\\test\\java\\org\\beckenburg\\FlaggedSourceAtlasRuntimeTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\\classes;build\\test org.beckenburg.FlaggedSourceAtlasRuntimeTest
          if errorlevel 1 exit /b 1
      - name: Generate repair screenshots with the actual renderer
        continue-on-error: true
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\CastleLiveRepairVisualTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.CastleLiveRepairVisualTest
          if errorlevel 1 exit /b 1
      - name: Real Castle NPC directional screenshots from production renderer
        shell: cmd
        run: |
          if not exist build\test mkdir build\test
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\CastleResidentArtRenderAudit.java src\test\java\org\beckenburg\GroundedSpriteFeetTest.java src\test\java\org\beckenburg\SpriteFloorContactTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.GroundedSpriteFeetTest
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.SpriteFloorContactTest
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.CastleResidentArtRenderAudit build/e2e/npc-grounding
          if errorlevel 1 exit /b 1
      - name: Archive exact in-game NPC captures, every resident and four directions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: castle-npc-grounding-actual-game
          path: build/e2e/npc-grounding/*
          if-no-files-found: warn
      - name: Publish accepted in-engine screenshots for direct visual review
        if: success()
        shell: pwsh
        run: |
          $dest = "development/levels/previews/npc-ground-proof-2026-11-04"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "build/e2e/npc-grounding/*" $dest -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $dest
          if (-not (git status --porcelain)) { Write-Host "Already published"; exit 0 }
          git commit -m "Preserve exact renderer NPC view and foot grounding screenshots"
          if ($LASTEXITCODE -ne 0) { throw "Cannot commit NPC screenshots" }
          for ($attempt=1; $attempt -le 4; $attempt++) {
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { throw "Evidence rebase conflict" }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { Write-Host "Actual PNGs published"; exit 0 }
            Start-Sleep -Seconds $attempt
          }
          throw "Could not publish screenshot evidence without force"
      - name: Preserve castle inspection images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: castle-repair-visual-evidence
          path: build/e2e/castle-repairs/*.png
          if-no-files-found: warn
