name: Hollow Creek alpha trees - focused real renderer (advisory)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hollow-creek-billboard-render-check.yml'
      - 'src/main/java/org/beckenburg/GlbProps.java'
      - 'src/main/java/org/beckenburg/SceneRenderer.java'
      - 'src/main/java/org/beckenburg/DevAssetReviewCatalog.java'
      - 'src/test/java/org/beckenburg/HollowCreekBillboardAlphaRuntimeTest.java'
permissions:
  contents: read
jobs:
  focused-original-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build actual game resources, preserve unrelated regression result
        shell: bash
        run: |
          set +e
          bash build.sh > /tmp/hc-build-diagnostic.log 2>&1
          status=$?
          set -e
          mkdir -p build/hollow-creek-alpha-check
          cp /tmp/hc-build-diagnostic.log build/hollow-creek-alpha-check/build-diagnostics.log
          if [ "$status" != 0 ]; then
            echo "::warning::Unrelated full Linux regression exited $status; inspect preserved diagnostic log."
          fi
          test -s build/classes/org/beckenburg/SceneRenderer.class
          test -s build/classes/org/beckenburg/GlbProps.class
          test -s build/classes/org/beckenburg/models/level_hc_native_284_0.glb
          test -s build/classes/org/beckenburg/sites/hollow-creek-scene.tsv
      - name: Check original source alpha material and catalog without altering runtime
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/hollow-creek-alpha-check/test
          javac --release 17 -encoding UTF-8 -cp build/classes -d build/hollow-creek-alpha-check/test \
            src/test/java/org/beckenburg/HollowCreekBillboardAlphaRuntimeTest.java \
            src/test/java/org/beckenburg/HollowCreekDevCatalogClassificationTest.java
          java -Djava.awt.headless=true -ea -cp build/classes:build/hollow-creek-alpha-check/test \
            org.beckenburg.HollowCreekBillboardAlphaRuntimeTest
          java -Djava.awt.headless=true -ea -cp build/classes:build/hollow-creek-alpha-check/test \
            org.beckenburg.HollowCreekDevCatalogClassificationTest
      - name: Render three approved source PNG tree billboards in real software DEV room
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for id in level_hc_native_284_0 level_hc_native_300_0 level_hc_native_350_0; do
            folder="build/hollow-creek-alpha-check/$id"
            java -Djava.awt.headless=true -cp build/classes \
              org.beckenburg.DevAssetShowroom --dev-room --capture "--asset=$id" "--output=$folder"
          done
      - name: Upload exact original renderer pixels and functional regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollow-creek-original-alpha-post-repair-render
          path: build/hollow-creek-alpha-check/
          if-no-files-found: warn
          retention-days: 21
