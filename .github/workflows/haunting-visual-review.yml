name: Haunting FX - Runtime Validation and Visual Review

on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/org/beckenburg/HauntingScreenFx.java'
      - 'src/main/java/org/beckenburg/GhostHauntingFolio.java'
      - 'src/main/java/org/beckenburg/GhostHauntingChoreography.java'
      - 'src/test/java/org/beckenburg/HauntingScreenFxTest.java'
      - 'src/test/java/org/beckenburg/HauntingVisualReview.java'
      - '.github/workflows/haunting-visual-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  haunt-preview:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile the real renderer, test classes and packaged assets
        shell: cmd
        run: call build.cmd e2e
      - name: Haunting appearance and event visuals (advisory diagnostics only)
        continue-on-error: true
        shell: cmd
        run: |
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.HauntingScreenFxTest
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.GhostHauntingFolioTest
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.GhostHauntingChoreographyTest
          if errorlevel 1 exit /b 1
      - name: Capture real game-scene overlays at native PSX render target
        continue-on-error: true
        shell: cmd
        run: |
          java -Djava.awt.headless=true -cp build\classes;build\test org.beckenburg.HauntingVisualReview build\haunting-visual-review
      - name: Upload advisory haunting screenshots and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beckenburg-haunting-fx-art-review
          path: build/haunting-visual-review/
          if-no-files-found: warn
          retention-days: 21
