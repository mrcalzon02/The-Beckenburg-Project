name: Build primitive map prop grayboxes
on:
  push:
    branches: [main]
    paths:
      - 'development/levels/primitive-props-v1/catalog.json'
      - 'development/levels/primitive-props-v1/build.py'
      - 'development/levels/primitive-props-v1/audit.py'
      - 'development/levels/primitive-props-v1/geometry_regression.py'
      - 'development/levels/primitive-props-v1/source_readiness.py'
      - 'development/levels/primitive-props-v1/kits.py'
      - 'development/levels/primitive-props-v1/castle-crypt-proposal.json'
      - 'development/levels/primitive-props-v1/crypt.py'
      - 'development/levels/primitive-props-v1/relics.py'
      - 'development/levels/primitive-props-v1/fit.py'
      - 'development/levels/primitive-props-v1/fit-recipe.json'
      - 'development/levels/layouts/**/layout.json'
      - '.github/workflows/primitive-map-props.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: primitive-map-props-sparse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            development/levels/primitive-props-v1
            development/levels/layouts
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate all measured primitive GLBs
        run: python development/levels/primitive-props-v1/build.py
      - name: Fit 61 proposed props against real map geometry reservations
        run: python development/levels/primitive-props-v1/fit.py
      - name: Recheck fitted placements and review GLBs
        run: python development/levels/primitive-props-v1/fit.py --check
      - name: Verify byte-for-byte regeneration and bounded GLB integrity
        run: |
          python development/levels/primitive-props-v1/build.py --check
          python - <<'PY'
          import json, struct
          from pathlib import Path
          root=Path("development/levels/primitive-props-v1")
          catalog=json.loads((root/"catalog.json").read_text())
          verification=json.loads((root/"verification.json").read_text())
          assert len(catalog["models"])==298
          assert len(catalog["models"])==len(verification["models"])
          fitted=json.loads((root/"fit-verification.json").read_text())
          assert fitted["sites"]==5 and fitted["placements"]==61
          for item in fitted["maps"]:
              assert item["placements"]>=7
              print(item["site"],item["placements"],"fits",item["review_triangles"],"triangles")
          assert len(catalog["sites"])==29
          for rec in verification["models"]:
              data=(root/"models"/(rec["id"]+".glb")).read_bytes()
              sig,ver,length,jlen,jtype=struct.unpack_from("<IIIII",data,0)
              assert sig==0x46546C67 and ver==2 and length==len(data) and jtype==0x4e4f534a
              document=json.loads(data[20:20+jlen])
              assert document["extras"]["runtimeApproved"] is False
              assert document["nodes"][0]["name"]==rec["id"]
              assert document["accessors"] and document["bufferViews"]
              assert document["buffers"][0]["byteLength"]>0
              assert rec["triangles"]<=3500 and rec["bytes"]==len(data)
          print("Validated",len(verification["models"]),"independent GLBs")
          PY
      - name: Generate all 29 map-specific source-only 3D model contact galleries
        run: python development/levels/primitive-props-v1/kits.py
      - name: Verify kit pages are byte-for-byte reproducible
        run: python development/levels/primitive-props-v1/kits.py --check
      - name: Count eight proposed Castle sarcophagi with crypt chamber clearances
        run: python development/levels/primitive-props-v1/crypt.py
      - name: Verify sarcophagus inventory and separate nonshipping 3D crypt preview
        run: python development/levels/primitive-props-v1/crypt.py --check
      - name: Generate twelve independent relic models into two clearanced Castle vault display banks
        run: python development/levels/primitive-props-v1/relics.py
      - name: Verify relic placements and 3D sources byte-for-byte
        run: python development/levels/primitive-props-v1/relics.py --check
      - name: Verify refined prop orientation, shaft opening and actual GLB bounds
        run: python development/levels/primitive-props-v1/geometry_regression.py
      - name: Independently decode embedded GLB PNGs and audit map assignments
        run: python development/levels/primitive-props-v1/audit.py
      - name: Record every source model's geometry readiness and downstream review blockers
        run: |
          python development/levels/primitive-props-v1/source_readiness.py
          python development/levels/primitive-props-v1/source_readiness.py --check
      - name: Preserve generated model assets on main (no force)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add development/levels/primitive-props-v1/readiness-report.json development/levels/primitive-props-v1/models development/levels/primitive-props-v1/verification.json development/levels/primitive-props-v1/placements development/levels/primitive-props-v1/previews development/levels/primitive-props-v1/fit-verification.json development/levels/primitive-props-v1/site-kits development/levels/primitive-props-v1/crypt-review development/levels/primitive-props-v1/relic-review
          if git diff --cached --quiet; then
            echo "All generated grayboxes already match main."
            exit 0
          fi
          git commit -m "Regenerate source-only map GLB prototypes and validated PNG textures"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Generated grayboxes pushed on attempt $attempt."
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || exit 1
            sleep $((attempt * 2))
          done
          echo "Non-force push was rejected after bounded attempts" >&2
          exit 1
