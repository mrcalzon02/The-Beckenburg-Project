name: Development gallery index
on:
  push:
    branches: [main]
    paths: ['development/**', 'tools/build_development_gallery.py', 'beckenburg-development-gallery.html', '.github/workflows/development-gallery.yml']
  pull_request:
    paths: ['development/**', 'tools/build_development_gallery.py', 'beckenburg-development-gallery.html', '.github/workflows/development-gallery.yml']
# The gallery can gain images from multiple independently running capture
# workflows. Serialize index rebuilds without cancelling older work.
concurrency:
  group: beckenburg-development-gallery-main
  cancel-in-progress: false
permissions:
  contents: write
  actions: read  # Read one small, previously captured native game-renderer artifact.
jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify a proposed PR commits all captures and hashes
        if: github.event_name == 'pull_request'
        run: python tools/build_development_gallery.py --check
      - name: Rebuild and push complete gallery index for new main captures
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            # Always rebuild against latest remote main. A prior screenshot run
            # may have committed more evidence while this job was queued.
            git fetch origin main
            git checkout -B gallery-index-write origin/main
            # One-time permanent archival of the ORIGINAL native renderer
            # screenshots from the successful focused Blackpine test.
            # Reuse this existing gallery job, not a separate workflow. Once
            # committed, subsequent runs skip all artifact/network work.
            proof=development/levels/previews/blackpine/ci-stair-proof-43157419417
            if [[ ! -s "$proof/blackpine-stair-native-proof.png" ]]; then
              staging=$(mktemp -d)
              gh run download 43157419417 --repo "$GITHUB_REPOSITORY" \
                --name beckenburg-blackpine-native-proof-43157419417 --dir "$staging"
              mkdir -p "$proof"
              for file in blackpine-stair-native-proof.png stair-ascent-real-render.png loft-landing-real-render.png; do
                test -s "$staging/$file"
                cp "$staging/$file" "$proof/$file"
              done
              {
                echo '# Blackpine mill stair — original native game screenshots'
                echo ''
                echo 'Source: GitHub Actions full multiplayer acceptance run 43157419417'
                echo 'Exact game source: 6ce17c0cad0ea4b79e36bba4ed5b22c38068a549'
                echo ''
                echo 'These three original PNG files were written by BlackpineStairVisualTest'
                echo 'through the real SceneRenderer using authored geometry and collision.'
                echo 'The contact sheet is a native screenshot, not an illustration.'
                echo 'The scene is dark; physical two-PC and headphone checks remain open.'
                echo 'Full regression for the repaired staircase passed 378/378 at run 43148970756.'
              } > "$proof/README.md"
              git add "$proof"
              rm -rf "$staging"
            fi
            python tools/build_development_gallery.py --tracked-only
            python tools/build_development_gallery.py --tracked-only --check
            git add development/gallery/index.json beckenburg-development-gallery.html
            if git diff --cached --quiet; then
              echo 'PASS: published gallery already matches all tracked source captures'
              exit 0
            fi
            git commit -m 'Index current Beckenburg development captures and SHA-256'
            if git push origin HEAD:main; then
              echo "PASS: rebuilt and published index from $(git rev-parse HEAD)"
              exit 0
            fi
            echo "Concurrent main update interrupted gallery push; recomputing against latest source (attempt $attempt)"
            sleep $((attempt*3))
          done
          echo 'FAIL: could not push a current index after four non-force attempts' >&2
          exit 1
