name: Diagnostic Hunter lobby portrait comparison against original Beckenburg art
on:
  push:
    branches: [main]
    paths:
      - 'tools/audit_lobby_hunter_art.py'
      - '.github/workflows/hunter-portrait-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-art-only-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect original source artwork and actual installed directional sprites
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python tools/audit_lobby_hunter_art.py --out build/hunter-portrait-source-audit
      - name: Diagnostic artwork only, never a Windows installer release gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-hunter-master-vs-current-segmented-lobby-previews
          path: build/hunter-portrait-source-audit/
          if-no-files-found: warn
          retention-days: 10

  packaged-original-lobby-swing-test:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the actual Java 17 Windows game package with original portrait resources
        shell: cmd
        run: call build.cmd package
      - name: Compare actual JAR lobby portraits pixel-for-pixel to original masters
        shell: cmd
        continue-on-error: true # Nonfunctional artwork must NOT block an installer release.
        run: |
          if not exist build\test mkdir build\test
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\OriginalHunterLobbyPortraitTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\beckenburg-game.jar;build\test org.beckenburg.OriginalHunterLobbyPortraitTest
          if errorlevel 1 exit /b 1
      - name: Publish actual rendered original-art lobby cards as diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beckenburg-three-full-original-hunter-lobby-cards
          path: build/e2e/hunter-original-lobby/*.png
          if-no-files-found: warn
          retention-days: 10
