name: Repair Flagged Hunter Source Cutouts (advisory art)
on:
  push:
    branches: [main]
    paths:
      - tools/repair_flagged_hunter_cutouts.py
      - .github/workflows/repair-flagged-hunter-sprites.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Cosmetic diagnostics are never release-blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-art segmentation dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless pillow
      - name: Rebuild only flagged Observer and Demonologist frames from canonical boards
        id: regenerate
        run: python tools/repair_flagged_hunter_cutouts.py
      - name: Preserve full-size before/after source cutouts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagged-hunter-head-boots-original-source-comparison
          path: development/verification/flagged-hunter-source-repair.png
          if-no-files-found: warn
          retention-days: 21
      - name: Commit actual regenerated runtime archive and review manifest
        if: steps.regenerate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Beckenburg source-art repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/runtime/character-directions.zip assets/runtime/character-directions-manifest.json development/verification/flagged-hunter-source-repair.png
          if git diff --cached --quiet; then
            echo "No source cutout changes"
            exit 0
          fi
          git commit -m "Restore original Observer and Demonologist heads and boots in packaged sprite atlas"
          # Never force-push. A moving main is retried with a normal rebase
          # and a bounded count; an unresolvable conflict is a truthful failure.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Committed source-backed runtime sprites to main"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Could not push repaired sprites without modifying remote history"
          exit 1
