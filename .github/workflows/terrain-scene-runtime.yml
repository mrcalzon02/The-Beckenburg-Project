name: Terrain Scene Runtime Physics Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/org/beckenburg/TerrainSceneNativePhysics.java'
      - 'src/main/java/org/beckenburg/UserLevelLibrary.java'
      - 'src/main/java/org/beckenburg/DeveloperLevelEditor.java'
      - 'src/main/java/org/beckenburg/editor/EditorAgentService.java'
      - 'src/main/java/org/beckenburg/editor/EditorDocumentStore.java'
      - 'src/main/java/org/beckenburg/editor/RuntimeSceneDocument.java'
      - 'src/main/java/org/beckenburg/LevelAuthoringSession.java'
      - 'src/main/java/org/beckenburg/CastleLevelEdits.java'
      - 'src/main/java/org/beckenburg/CastleEditorAgent.java'
      - 'src/test/java/org/beckenburg/CastleDocumentRecoveryTest.java'
      - 'src/main/java/org/beckenburg/GroundRecovery.java'
      - 'src/main/java/org/beckenburg/HouseMap.java'
      - 'src/test/java/org/beckenburg/GroundRecoverySupportParityTest.java'
      - 'tools/verify_editor_agent_host.cmd'
      - 'tools/verify_editor_agent_cli.py'
      - 'src/main/java/org/beckenburg/EnvironmentModuleEditor.java'
      - 'src/main/java/org/beckenburg/editor/StitchedWorldEditor.java'
      - 'src/test/java/org/beckenburg/TerrainSceneNativePhysicsTest.java'
      - 'src/main/java/org/beckenburg/editor/TerrainRailMesh.java'
      - 'src/main/java/org/beckenburg/editor/TerrainRailScenePackage.java'
      - 'src/main/java/org/beckenburg/editor/TerrainScenePackage.java'
      - 'src/test/java/org/beckenburg/editor/TerrainRailMeshTest.java'
      - '.github/workflows/terrain-scene-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-authority:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile actual game and portable editor sources
        shell: cmd
        run: call build.cmd package
      - name: Inspect real rail extrusion normals and OBJ roundtrip
        shell: cmd
        run: |
          if not exist build\test mkdir build\test
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\editor\TerrainRailMeshTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.editor.TerrainRailMeshTest
          if errorlevel 1 exit /b 1
      - name: Verify published scene geometry inside native HCS2 physics
        shell: cmd
        run: |
          javac --release 17 -encoding UTF-8 -cp build\classes -d build\test src\test\java\org\beckenburg\TerrainSceneNativePhysicsTest.java
          if errorlevel 1 exit /b 1
          java -Djava.awt.headless=true -ea -cp build\classes;build\test org.beckenburg.TerrainSceneNativePhysicsTest
          if errorlevel 1 exit /b 1
      - name: Verify authoritative authoring service and native save recovery
        shell: cmd
        run: call tools\verify_editor_agent_host.cmd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-editor-agent-evidence
          path: build/editor-agent-evidence
